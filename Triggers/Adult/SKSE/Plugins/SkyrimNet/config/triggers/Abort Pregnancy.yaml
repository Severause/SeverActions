name: "Abort Pregnancy"
description: "Fires when the Abort Pregnancy spell is cast on a target, ending the target's pregnancy — with or without the target's consent."

eventCriteria:
  eventType: "active_effect"
  schemaConditions:
    - fieldPath: "effect"
      operator: "equals"
      value: "Abort Pregnancy"
      caseSensitive: false
    - fieldPath: "action"
      operator: "equals"
      value: "applied"

response:
  type: "direct_narration"
  content: "{{ player.name }} casts a spell on {{ event_json.target }}, ending the pregnancy."

audience: "target"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 1
