plugin:
  name: SeverActions
  version: "3.0"
  description: "SkyrimNet companion / outfit / arrest / cast-spell action pack"
  icon: "\U0001F30A"

# ── LLM Variants ──
# Each variant is a named LLM-config bucket, listed as its own row on SkyrimNet's
# AI > LLMs page. Native/src/LlmVariantCore.h says which background prompt goes
# to which; check_release check 2 keeps the names here and there in step.
# A variant with no saved settings starts from the fields below, or SkyrimNet's
# base model when they are empty; never from sever_background's row.
variants:
  - name: sever_stories
    description: "SeverActions stories: off-screen life events, retainer work stories and courier letters."
  - name: sever_banter
    description: "SeverActions banter: follower banter and ambient banter between nearby NPCs."
  - name: sever_decisions
    description: "SeverActions decisions: the ambient action director, its adjudicator and the parley verdict."
  - name: sever_assessments
    description: "SeverActions assessments: relationship, companion-to-companion, reputation and intimacy stance reads."
  - name: sever_summaries
    description: "SeverActions summaries: quest awareness summaries."
  - name: sever_background
    description: "Background prompts other mods send through SeverActions on this row. SeverActions' own prompts use the five rows above."

schema:
  fields:
    # ── LLM Overrides ──
    # SkyrimNet copies these into each variant above that has no saved settings
    # yet (RegisterPluginVariant keeps a saved row); after that the row's own
    # settings on the AI > LLMs page win. Empty / 0 = SkyrimNet's base config.
    - name: "API Endpoint"
      path: "llm.endpoint"
      type: "string"
      description: "Starting API endpoint for SeverActions' rows on the AI > LLMs page that have no saved settings yet (e.g., http://localhost:5000/v1 for a local model). Change a row there afterwards. Leave empty to use the base endpoint."
      defaultValue: ""
      category: "LLM Overrides"

    - name: "API Key"
      path: "llm.api_key"
      type: "string"
      description: "API key for the endpoint above, used the same way. Leave empty to use the base API key."
      defaultValue: ""
      category: "LLM Overrides"

    - name: "Model Name"
      path: "llm.model_name"
      type: "string"
      description: "Starting model for SeverActions' rows on the AI > LLMs page that have no saved settings yet (e.g., 'meta-llama/llama-3.3-70b-instruct' or any OpenRouter model id). Change a row there afterwards. Leave empty to use the same model as dialogue."
      defaultValue: ""
      category: "LLM Overrides"

    - name: "Temperature"
      path: "llm.temperature"
      type: "float"
      description: "Starting temperature for those rows. Set to 0 to use the base config value."
      defaultValue: 0
      min: 0.0
      max: 2.0
      category: "LLM Overrides"

    - name: "Max Tokens"
      path: "llm.max_tokens"
      type: "int"
      description: "Starting max response tokens for those rows. Set to 0 to use the base config value."
      defaultValue: 0
      min: 0
      max: 4096
      category: "LLM Overrides"

    - name: "Request Timeout (seconds)"
      path: "llm.timeout"
      type: "int"
      description: "Starting request timeout in seconds for those rows. Set to 0 to use the base config value."
      defaultValue: 0
      min: 0
      max: 120
      category: "LLM Overrides"
