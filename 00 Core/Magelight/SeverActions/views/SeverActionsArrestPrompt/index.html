<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeverActions Arrest Prompt</title>
    <style>
      /* Arrest prompt overlay -- non-pausing HUD card.
         Visual tokens copied from the Brawl + CollectPayment prompts
         (brass-on-dark, EB Garamond). Vanilla HTML/CSS -- no React.

         Buttons are color-coded by severity:
           green  -- Pay Fine, Bribe (transactional, ends peacefully)
           red    -- Resist, Refuse (turns hostile)
           tan    -- Persuade (speech check, neutral)
           brass  -- Submit (default / auto-fire on timeout/Escape) */

      /* Default values: the main UI's tokens, then this card's own with their gen_themes.py roles. */
      :root {
        --accent: #cba560;
        --accent-warm: #c9a866;
        --color-error: #a8513e;
        --card-ground-top: #140e06; /* theme: ground */
        --card-ground-bottom: #1e160a; /* theme: ground */
        --card-ink: #e2c382; /* theme: accent */
        --money-ink: #f0d28a; /* theme: fixed-ink */
        --btn-ground: #3c2d16; /* theme: ground */
        --btn-ground-hi: #55411e; /* theme: ground */
        --btn-go-ink: #d8e5b8; /* theme: fixed-ink */
        --btn-go-edge: #8caf5f; /* theme: fixed */
        --btn-go-fill: #374b1e; /* theme: fixed-ground */
        --btn-go-edge-hi: #aac878; /* theme: fixed */
        --btn-stop-ink: #e6b69a; /* theme: fixed-ink */
        --btn-stop-fill: #502319; /* theme: fixed-ground */
        --btn-stop-edge-hi: #c86e5a; /* theme: fixed */
        --btn-talk-ink: #e8d6a8; /* theme: fixed-ink */
        --btn-talk-edge: #ba9c5c; /* theme: fixed */
        --btn-talk-fill: #463719; /* theme: fixed-ground */
        --btn-talk-edge-hi: #d8ba7a; /* theme: fixed */
        --well: #000000; /* theme: ink */ /* a black well fill */
      }
      /* BEGIN GENERATED theme blocks (scripts/themes/gen_themes.py) */
      :root[data-theme="windhelm"] {
          --accent: #7cb2ce;
          --accent-warm: #7db3d0;
          --card-ground-top: #05101c;
          --card-ground-bottom: #081829;
          --card-ink: #97ceeb;
          --btn-ground: #103150;
          --btn-ground-hi: #154673;
      }
      :root[data-theme="dwemer"] {
          --accent: #ec9660;
          --accent-warm: #ee9862;
          --card-ground-top: #011212;
          --card-ground-bottom: #011b1b;
          --card-ink: #feb78c;
          --btn-ground: #013636;
          --btn-ground-hi: #034d4d;
      }
      :root[data-theme="soulcairn"] {
          --accent: #be9aef;
          --accent-warm: #c09cf1;
          --card-ground-top: #150b1a;
          --card-ground-bottom: #1f1226;
          --card-ink: #d6bbfe;
          --btn-ground: #3e264c;
          --btn-ground-hi: #59366d;
      }
      :root[data-theme="vellum"] {
          --accent: #664603;
          --accent-warm: #654502;
          --color-error: #943f2d;
          --card-ground-top: #d7caaf;
          --card-ground-bottom: #dccfb3;
          --card-ink: #593d03;
          --money-ink: #735801;
          --btn-ground: #e6d9bd;
          --btn-ground-hi: #ede0c4;
          --btn-go-ink: #556038;
          --btn-go-edge: #476510;
          --btn-go-fill: #d9eec4;
          --btn-go-edge-hi: #4b6410;
          --btn-stop-ink: #7c5239;
          --btn-stop-fill: #fee1da;
          --btn-stop-edge-hi: #974230;
          --btn-talk-ink: #6a5a30;
          --btn-talk-edge: #745812;
          --btn-talk-fill: #f8e5c2;
          --btn-talk-edge-hi: #735814;
          --well: #796a5b;
      }
      /* END GENERATED theme blocks */

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        font-family: 'Trajan Pro', 'EB Garamond', Georgia, serif;
        font-size: 19px;
        color: var(--accent);
        overflow: hidden;
        pointer-events: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .arrest-overlay {
        display: none;
        pointer-events: auto;
        padding-bottom: 14vh;
        width: 100%;
        max-width: 680px;
        justify-content: center;
        animation: arrest-rise 220ms ease-out;
      }
      .arrest-overlay.visible { display: flex; }

      @keyframes arrest-rise {
        from { transform: translateY(20px); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }

      .arrest-card {
        width: 100%;
        background:
          linear-gradient(to bottom,
            color-mix(in srgb, var(--card-ground-top) 96%, transparent),
            color-mix(in srgb, var(--card-ground-bottom) 96%, transparent));
        border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
        border-radius: 5px;
        box-shadow:
          0 8px 26px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 color-mix(in srgb, var(--card-ink) 18%, transparent);
        padding: 18px 22px 0 22px;
        overflow: hidden;
      }

      .arrest-header {
        font-size: 0.85em;
        letter-spacing: 0.22em;
        color: color-mix(in srgb, var(--accent) 78%, transparent);
        font-weight: 600;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
        padding-bottom: 7px;
        margin-bottom: 12px;
      }

      .arrest-body {
        font-size: 1.12em;
        line-height: 1.5;
        color: color-mix(in srgb, var(--card-ink) 97%, transparent);
        margin-bottom: 16px;
      }
      .arrest-name {
        color: var(--card-ink);
        font-weight: 600;
      }
      .arrest-bounty {
        color: var(--money-ink);
        font-weight: 600;
      }

      .arrest-actions {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .arrest-btn {
        flex: 1 1 0;
        min-width: 110px;
        padding: 11px 10px;
        background: color-mix(in srgb, var(--btn-ground) 55%, transparent);
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        border-radius: 3px;
        cursor: pointer;
        font-family: inherit;
        font-size: 1em;
        letter-spacing: 0.06em;
        transition: background 80ms ease-out, border-color 80ms ease-out;
      }
      .arrest-btn:hover {
        background: color-mix(in srgb, var(--btn-ground-hi) 70%, transparent);
        border-color: color-mix(in srgb, var(--card-ink) 65%, transparent);
      }

      /* Submit -- brass default (matches Accept's brass-on-dark base). */
      .arrest-btn--submit {
        color: var(--card-ink);
        border-color: color-mix(in srgb, var(--accent) 70%, transparent);
      }
      .arrest-btn--submit:hover {
        background: color-mix(in srgb, var(--btn-ground-hi) 70%, transparent);
        border-color: color-mix(in srgb, var(--card-ink) 85%, transparent);
      }

      /* Pay/Bribe -- green (transactional). */
      .arrest-btn--pay {
        color: var(--btn-go-ink);
        border-color: color-mix(in srgb, var(--btn-go-edge) 55%, transparent);
      }
      .arrest-btn--pay:hover {
        background: color-mix(in srgb, var(--btn-go-fill) 55%, transparent);
        border-color: color-mix(in srgb, var(--btn-go-edge-hi) 70%, transparent);
      }

      /* Resist/Refuse -- red (hostile). */
      .arrest-btn--resist {
        color: var(--btn-stop-ink);
        border-color: color-mix(in srgb, var(--color-error) 55%, transparent);
      }
      .arrest-btn--resist:hover {
        background: color-mix(in srgb, var(--btn-stop-fill) 55%, transparent);
        border-color: color-mix(in srgb, var(--btn-stop-edge-hi) 70%, transparent);
      }

      /* Persuade -- parchment/tan (speech check). */
      .arrest-btn--persuade {
        color: var(--btn-talk-ink);
        border-color: color-mix(in srgb, var(--btn-talk-edge) 55%, transparent);
      }
      .arrest-btn--persuade:hover {
        background: color-mix(in srgb, var(--btn-talk-fill) 55%, transparent);
        border-color: color-mix(in srgb, var(--btn-talk-edge-hi) 75%, transparent);
      }

      /* Drain bar -- gold->lighter-gold fill, breaks out of card padding
         via negative margin + width:calc. Matches Brawl/CollectPayment. */
      .arrest-timer {
        height: 5px;
        background: color-mix(in srgb, var(--well) 60%, transparent);
        overflow: hidden;
        margin: 0 -22px;
        padding: 0;
        width: calc(100% + 44px);
      }
      .arrest-timer-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(
          to right,
          color-mix(in srgb, var(--accent) 95%, transparent),
          color-mix(in srgb, var(--card-ink) 95%, transparent)
        );
        transform-origin: left center;
        animation-name: arrest-drain;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes arrest-drain {
        from { transform: scaleX(1); }
        to   { transform: scaleX(0); }
      }
    </style>
  </head>
  <body>
    <div id="overlay" class="arrest-overlay" role="dialog" aria-modal="false" aria-label="Arrest">
      <div class="arrest-card">
        <div class="arrest-header" id="hdr">ARREST</div>
        <div class="arrest-body" id="body">
          <span id="guard" class="arrest-name">A guard</span> stops you. Bounty: <span id="bounty" class="arrest-bounty">0</span> gold.
        </div>
        <div class="arrest-actions" id="actions">
          <!-- buttons injected dynamically -->
        </div>
        <div class="arrest-timer" aria-hidden="true">
          <div id="timer-fill" class="arrest-timer-fill"></div>
        </div>
      </div>
    </div>

    <script>
      // Arrest prompt frontend script.
      //
      // IN  -- window.receiveArrestPromptData({
      //          guardName, holdName, bounty, bribeCost,
      //          paymentFailed, persuadeAttempted, lowBounty, timeoutMs })
      // OUT -- window.arrestPromptChoice(JSON.stringify({choice}))
      //         choice in { "submit", "resist", "pay_fine", "bribe", "persuade" }
      //
      // Timeout / Escape -> auto-fires "submit". Submit is the safe default;
      // the player just walks into a cell rather than triggering an
      // unintended kill-on-sight from a stalled prompt.

      (function () {
        var overlay   = document.getElementById('overlay');
        var hdrE      = document.getElementById('hdr');
        var guardE    = document.getElementById('guard');
        var bountyE   = document.getElementById('bounty');
        var bodyE     = document.getElementById('body');
        var actionsE  = document.getElementById('actions');
        var timerFill = document.getElementById('timer-fill');
        var autoHandle = null;

        function postChoice(choice) {
          var body = JSON.stringify({ choice: choice });
          var tryCall = function () {
            var fn = window.arrestPromptChoice;
            if (typeof fn !== 'function') return false;
            try { fn(body); return true; }
            catch (e) { console.warn('[ArrestPrompt] choice send failed:', e); return false; }
          };
          if (!tryCall()) {
            console.warn('[ArrestPrompt] arrestPromptChoice not bound yet, retrying...');
            window.setTimeout(function () {
              if (!tryCall()) {
                console.error('[ArrestPrompt] arrestPromptChoice still not bound after retry');
              }
            }, 200);
          }
        }

        // Expose to the separate nav <script> block below — identifiers declared
        // inside this IIFE are not visible across <script> scopes (Escape dismiss
        // used to throw ReferenceError, which broke VR controller cancel).
        window.__postChoice = postChoice;

        function close() {
          overlay.classList.remove('visible');
          if (autoHandle !== null) {
            window.clearTimeout(autoHandle);
            autoHandle = null;
          }
        }

        function makeBtn(label, choice, severity) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'arrest-btn arrest-btn--' + severity;
          b.textContent = label;
          b.addEventListener('click', function () {
            postChoice(choice);
            close();
          });
          return b;
        }

        function renderButtons(p) {
          // Clear existing buttons.
          while (actionsE.firstChild) actionsE.removeChild(actionsE.firstChild);

          var bribeLabel = 'Bribe (' + p.bribeCost + ' gold)';
          var fineLabel  = 'Pay Fine (' + p.bounty + ' gold)';

          if (p.lowBounty) {
            // Minor offense -- fine or refuse only (no jail).
            if (p.paymentFailed) {
              actionsE.appendChild(makeBtn('Submit to Arrest', 'submit', 'submit'));
              actionsE.appendChild(makeBtn('Refuse',           'resist', 'resist'));
            } else {
              actionsE.appendChild(makeBtn(fineLabel, 'pay_fine', 'pay'));
              actionsE.appendChild(makeBtn('Refuse',  'resist',   'resist'));
            }
          } else {
            // Major offense -- arrest options.
            if (p.paymentFailed && p.persuadeAttempted) {
              actionsE.appendChild(makeBtn('Submit to Arrest', 'submit', 'submit'));
              actionsE.appendChild(makeBtn('Resist Arrest',    'resist', 'resist'));
            } else if (p.paymentFailed && !p.persuadeAttempted) {
              actionsE.appendChild(makeBtn('Submit to Arrest', 'submit',   'submit'));
              actionsE.appendChild(makeBtn('Resist Arrest',    'resist',   'resist'));
              actionsE.appendChild(makeBtn('Persuade',         'persuade', 'persuade'));
            } else if (!p.paymentFailed && p.persuadeAttempted) {
              actionsE.appendChild(makeBtn('Submit to Arrest', 'submit', 'submit'));
              actionsE.appendChild(makeBtn('Resist Arrest',    'resist', 'resist'));
              actionsE.appendChild(makeBtn(bribeLabel,         'bribe',  'pay'));
            } else {
              actionsE.appendChild(makeBtn('Submit to Arrest', 'submit',   'submit'));
              actionsE.appendChild(makeBtn('Resist Arrest',    'resist',   'resist'));
              actionsE.appendChild(makeBtn(bribeLabel,         'bribe',    'pay'));
              actionsE.appendChild(makeBtn('Persuade',         'persuade', 'persuade'));
            }
          }
        }

        function renderBody(p) {
          // Header reads "ARREST IN <HOLD>" when we have a hold name.
          var hold = (p.holdName || '').toString().trim();
          hdrE.textContent = hold ? ('ARREST IN ' + hold.toUpperCase()) : 'ARREST';

          guardE.textContent  = p.guardName || 'A guard';
          bountyE.textContent = (p.bounty != null ? p.bounty : 0).toString();

          // Contextual flavor line -- mirrors the SkyMessage text in
          // SeverActions_ArrestPlayer.psc::ShowPlayerArrestMenu.
          var holdPhrase = hold ? (' in ' + hold) : '';
          var lead = '';
          if (p.lowBounty) {
            lead = p.paymentFailed
              ? ' The guard won’t accept payment attempts anymore.'
              : ' Pay your fine or face the consequences.';
          } else if (p.paymentFailed && p.persuadeAttempted) {
            lead = ' The guard has lost all patience. Submit or resist.';
          } else if (p.paymentFailed) {
            lead = ' The guard won’t accept payment anymore.';
          } else if (p.persuadeAttempted) {
            lead = ' The guard has lost patience. Make your choice now.';
          } else {
            lead = ' Submit to arrest or face the consequences.';
          }

          bodyE.innerHTML =
            '<span class="arrest-name">' + escapeHtml(p.guardName || 'A guard') + '</span>' +
            ' stops you. Bounty: <span class="arrest-bounty">' +
            escapeHtml((p.bounty != null ? p.bounty : 0).toString()) +
            '</span> gold' + escapeHtml(holdPhrase) + '.' + escapeHtml(lead);
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        window.receiveArrestPromptData = function (payload) {
          payload = payload || {};
          var ms = payload.timeoutMs || 60000;
          if (ms < 1000) ms = 1000;

          renderBody(payload);
          renderButtons(payload);

          // Restart drain bar.
          var clone = timerFill.cloneNode(true);
          clone.style.animationDuration = ms + 'ms';
          timerFill.parentNode.replaceChild(clone, timerFill);
          timerFill = clone;

          overlay.classList.add('visible');

          if (autoHandle !== null) {
            window.clearTimeout(autoHandle);
            autoHandle = null;
          }
          autoHandle = window.setTimeout(function () {
            autoHandle = null;
            postChoice('submit');
            close();
          }, ms);
        };

        try {
          if (typeof window.arrestPromptReady === 'function') {
            window.arrestPromptReady('');
          }
        } catch (e) { /* harmless */ }
      })();
    </script>
  <script>
  // Generic keyboard/controller navigation. The native GamepadUIBridge turns
  // gamepad input into keystrokes (A=Enter, B=Escape, d-pad/stick=arrows);
  // arrows move focus through visible controls, the first press lands on the
  // primary button. Text inputs keep Left/Right for the caret; selects keep
  // Up/Down for value browsing.
  (function () {
    var style = document.createElement('style');
    style.textContent = 'button:focus,input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb, var(--accent-warm) 90%, transparent);outline-offset:1px;}';
    document.head.appendChild(style);
    function focusables() {
      var all = document.querySelectorAll('button, input, select, textarea');
      var out = [];
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.disabled) continue;
        var r = el.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) continue;
        out.push(el);
      }
      return out;
    }
    function primary() {
      var els = focusables();
      for (var i = 0; i < els.length; i++) {
        var c = String(els[i].className || '');
        if (c.indexOf('--confirm') >= 0 || c.indexOf('--accept') >= 0 || c.indexOf('--go') >= 0 || c.indexOf('--primary') >= 0) return els[i];
      }
      return els.length ? els[0] : null;
    }
    document.addEventListener('keydown', function (e) {
      var k = e.key;
      // Escape dismisses silently — same contract as the native escape
      // monitor. This DOM path is the one that works for VR controllers:
      // PrismaVR delivers controller cancel as a key event to the view,
      // where GetAsyncKeyState (the native monitor) never sees it.
      if (k === 'Escape') { e.preventDefault(); if (typeof window.__postChoice === 'function') window.__postChoice('dismiss'); return; }
      if (k === 'Enter') {
        // Explicit activation: Ultralight does NOT click a focused button on
        // Enter by itself, so the gamepad's A (translated to Enter) was dead
        // on these popups. Buttons only - inputs/selects keep their own
        // Enter semantics.
        var fb = document.activeElement;
        if (fb && fb.tagName === 'BUTTON') { e.preventDefault(); fb.click(); }
        return;
      }
      if (k !== 'ArrowUp' && k !== 'ArrowDown' && k !== 'ArrowLeft' && k !== 'ArrowRight') return;
      var els = focusables();
      if (!els.length) return;
      var f = document.activeElement;
      var idx = els.indexOf(f);
      if (idx < 0) { e.preventDefault(); var p = primary(); if (p) p.focus(); return; }
      var tag = f.tagName;
      if (tag === 'SELECT' && (k === 'ArrowUp' || k === 'ArrowDown')) return;
      if ((tag === 'INPUT' || tag === 'TEXTAREA') && (k === 'ArrowLeft' || k === 'ArrowRight')) return;
      e.preventDefault();
      var next = (k === 'ArrowDown' || k === 'ArrowRight') ? idx + 1 : idx - 1;
      if (next < 0) next = els.length - 1;
      if (next >= els.length) next = 0;
      els[next].focus();
    });
  })();
</script>
  <!-- ml-ui-sounds: Magelight 0.29.0 button/hover sounds through the game's audio.
       Same logic as PrismaUI-frontend/src/lib/ui-sounds.ts (keep in step); no-op
       on PrismaUI, older Magelight and the browser. -->
  <script>
  (function () {
    var SEL = 'button,[role="button"],a[href],input[type="checkbox"],input[type="radio"],select,summary';
    var CANCEL_TEXT = /^(cancel|close|back|dismiss|not now|no|decline|\u00d7|\u2715|\u2716)$/i;
    var CANCEL_HINT = /(cancel|close|decline|dismiss|back)/i;
    function api() { var m = window.magelight; return (m && typeof m.sound === 'function') ? m : null; }
    function buttonOf(t) {
      var e = t;
      while (e && e.nodeType === 1) {
        if (e.hasAttribute('data-ml-sound') || e.hasAttribute('data-ml-sound-hover')) return null;
        if (e.matches && e.matches(SEL)) return e;
        e = e.parentNode;
      }
      return null;
    }
    function disabled(el) { return el.disabled === true || el.getAttribute('aria-disabled') === 'true'; }
    function clickName(el) {
      var text = (el.textContent || el.value || el.getAttribute('aria-label') || '').replace(/^\s+|\s+$/g, '');
      if (CANCEL_TEXT.test(text)) return 'cancel';
      return CANCEL_HINT.test((el.id || '') + ' ' + (el.getAttribute('class') || '')) ? 'cancel' : 'click';
    }
    var last = null;
    document.addEventListener('click', function (ev) {
      var m = api(); if (!m) return;
      var el = buttonOf(ev.target); if (!el || disabled(el)) return;
      m.sound(clickName(el));
    }, true);
    document.addEventListener('mouseover', function (ev) {
      var m = api(); if (!m) return;
      var el = buttonOf(ev.target); if (el === last) return;
      last = el; if (!el || disabled(el)) return;
      m.sound('hover:focus');
    }, true);
  })();
  </script>
</body>
</html>
