<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeverActions Travel Prompt</title>
<style>
  :root {
    /* Palette synced to the main menu's design tokens v2 ("The Ledger,
       Illuminated") — this file stays standalone by design, so the values
       are copied, not imported. */
    --bg-panel: var(--sa-bg-2);
    --brass: var(--sa-brass);
    --border: color-mix(in srgb, var(--sa-brass) 14%, transparent);
    --border-accent: color-mix(in srgb, var(--sa-brass) 30%, transparent);
    --text: var(--sa-ink);
    --text-dim: var(--sa-ink-mute);
    --bg-input: var(--sa-bg-0);
    --well: #000000; /* theme: ink */ /* a black well fill */
  }
  /* The main UI's names for the values above, at their defaults (the theme blocks below override them). */
  :root {
    --sa-bg-0: #131009;
    --sa-bg-2: #1f1913;
    --sa-brass: #c9a45c;
    --sa-ink: #cfc1a5;
    --sa-ink-mute: #948871;
    --accent-warm: #c9a866;
  }
  /* BEGIN GENERATED theme blocks (scripts/themes/gen_themes.py) */
  :root[data-theme="windhelm"] {
      --sa-bg-0: #08111a;
      --sa-bg-2: #121b25;
      --sa-brass: #7ab0cd;
      --sa-ink: #b9c4ce;
      --sa-ink-mute: #818a93;
      --accent-warm: #7db3d0;
  }
  :root[data-theme="dwemer"] {
      --sa-bg-0: #011313;
      --sa-bg-2: #071d1d;
      --sa-brass: #ea955e;
      --sa-ink: #d1c0ab;
      --sa-ink-mute: #968776;
      --accent-warm: #ee9862;
  }
  :root[data-theme="soulcairn"] {
      --sa-bg-0: #150e19;
      --sa-bg-2: #1f1723;
      --sa-brass: #bd99ee;
      --sa-ink: #c6c0ce;
      --sa-ink-mute: #8c8793;
      --accent-warm: #c09cf1;
  }
  :root[data-theme="vellum"] {
      --well: #796a5b;
      --sa-bg-0: #ccba94;
      --sa-bg-2: #e0d3b7;
      --sa-brass: #664603;
      --sa-ink: #3d3020;
      --sa-ink-mute: #594732;
      --accent-warm: #654502;
  }
  /* END GENERATED theme blocks */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Sitka Text", "Cambria", "Times New Roman", Georgia, serif; color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  /* Sizing is rem-based so the popupScale setting (root font-size, set
     by the bridge at open time) scales the whole card crisply. 1rem = the
     authored 16px; the setting's default 110% is the requested bump. */
  #overlay {
    position: fixed; right: 40px; bottom: 80px; width: 23.75rem;
    opacity: 0; transform: translateY(8px);
    transition: opacity 180ms ease, transform 180ms ease;
  }
  #overlay.show { opacity: 1; transform: translateY(0); }
  .tp-card {
    background: var(--bg-panel); border: 1px solid var(--border-accent);
    border-radius: 6px; box-shadow: 0 18px 56px rgba(0,0,0,0.65);
    padding: 1rem 1.125rem; display: flex; flex-direction: column; gap: 0.625rem;
  }
  .tp-title {
    font-size: 0.9375rem; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--brass); border-bottom: 1px solid color-mix(in srgb, var(--accent-warm) 20%, transparent);
    padding-bottom: 8px;
  }
  .tp-sub { font-size: 0.75rem; color: var(--text-dim); font-style: italic; }
  .tp-field { position: relative; }
  .tp-input {
    width: 100%; padding: 0.5rem 0.625rem; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-size: 0.875rem; font-family: inherit;
  }
  .tp-suggest {
    position: absolute; top: 2.375rem; left: 0; right: 0; z-index: 5;
    max-height: 10.625rem; overflow-y: auto;
    background: var(--bg-panel); border: 1px solid var(--border-accent);
    border-radius: 3px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
  }
  .tp-suggest-row {
    text-align: left; padding: 0.375rem 0.625rem; background: none; border: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent-warm) 8%, transparent);
    color: var(--text); font-size: 0.8125rem; cursor: pointer; font-family: inherit;
  }
  .tp-suggest-row:hover { background: color-mix(in srgb, var(--accent-warm) 12%, transparent); color: var(--brass); }
  .tp-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
  .tp-btn {
    padding: 0.375rem 1.125rem; background: color-mix(in srgb, var(--well) 25%, transparent);
    border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-size: 0.8125rem; cursor: pointer; font-family: inherit;
  }
  .tp-btn:hover { border-color: var(--border-accent); }
  .tp-btn--go { border-color: var(--brass); color: var(--brass); }
  /* Keyboard/controller focus must be VISIBLE — the gamepad bridge drives
     the popup with arrow keys + Enter, so focus is the cursor. */
  .tp-btn:focus, .tp-suggest-row:focus {
    outline: 2px solid var(--brass); outline-offset: 1px;
    background: color-mix(in srgb, var(--accent-warm) 15%, transparent);
  }
  .tp-input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .tp-timer { height: 3px; background: color-mix(in srgb, var(--well) 30%, transparent); border-radius: 2px; overflow: hidden; }
  .tp-timer-fill { height: 100%; width: 100%; background: var(--brass); transition: width linear; }
</style>
</head>
<body>
  <div id="overlay">
    <div class="tp-card">
      <div class="tp-title" id="title">Where to?</div>
      <div class="tp-sub">Confirm where they're headed — or type a different place.</div>
      <div class="tp-field">
        <input class="tp-input" id="dest" type="text" placeholder="Type a destination…" autocomplete="off" />
        <div class="tp-suggest" id="suggest" style="display:none"></div>
      </div>
      <div class="tp-actions">
        <button type="button" class="tp-btn tp-btn--go" id="btn-go">Go</button>
        <button type="button" class="tp-btn" id="btn-cancel">Not now</button>
      </div>
      <div class="tp-timer" aria-hidden="true"><div id="timer-fill" class="tp-timer-fill"></div></div>
    </div>
  </div>

<script>
  // Travel prompt frontend.
  //  IN  -- window.receiveTravelPromptData({ npcName, namedPlace, allLocations:[...], timeoutMs })
  //  OUT -- window.travelPromptChoice(JSON.stringify({ choice, place }))
  //         choice in { "confirm", "decline" }. Only "confirm" with a place travels.
  (function () {
    var MAX_SUGGEST = 5;
    var overlay  = document.getElementById('overlay');
    var titleE   = document.getElementById('title');
    var destE    = document.getElementById('dest');
    var suggestE = document.getElementById('suggest');
    var goB      = document.getElementById('btn-go');
    var cancelB  = document.getElementById('btn-cancel');
    var timerFill = document.getElementById('timer-fill');
    var allLocations = [];
    var timerHandle = null;
    var posted = false;

    function post(choice) {
      if (posted) return;
      posted = true;
      var payload = { choice: choice, place: destE.value.trim() };
      try { if (window.travelPromptChoice) window.travelPromptChoice(JSON.stringify(payload)); } catch (e) {}
    }

    function hideSuggest() { suggestE.style.display = 'none'; while (suggestE.firstChild) suggestE.removeChild(suggestE.firstChild); }

    function showSuggest() {
      var q = destE.value.trim().toLowerCase();
      hideSuggest();
      if (!q || allLocations.length === 0) return;
      var prefix = [], contains = [];
      for (var i = 0; i < allLocations.length; i++) {
        var lc = String(allLocations[i]).toLowerCase();
        var pos = lc.indexOf(q);
        if (pos === 0) { prefix.push(allLocations[i]); if (prefix.length >= MAX_SUGGEST) break; }
        else if (pos > 0 && contains.length < MAX_SUGGEST) { contains.push(allLocations[i]); }
      }
      var out = prefix.slice(0, MAX_SUGGEST);
      for (var j = 0; j < contains.length && out.length < MAX_SUGGEST; j++) out.push(contains[j]);
      if (out.length === 1 && String(out[0]).toLowerCase() === q) return; // already picked
      for (var k = 0; k < out.length; k++) {
        (function (name) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'tp-suggest-row'; b.textContent = name;
          b.addEventListener('mousedown', function (e) { e.preventDefault(); destE.value = name; hideSuggest(); });
          suggestE.appendChild(b);
        })(out[k]);
      }
      if (out.length > 0) suggestE.style.display = 'flex';
    }

    destE.addEventListener('input', showSuggest);
    destE.addEventListener('focus', showSuggest);
    destE.addEventListener('blur', function () { setTimeout(hideSuggest, 120); });

    goB.addEventListener('click', function () { if (destE.value.trim()) post('confirm'); });
    cancelB.addEventListener('click', function () { post('decline'); });

    // ── Keyboard / controller navigation ────────────────────────────────
    // The native GamepadUIBridge translates A→Enter, B→Escape, d-pad/stick→
    // arrows. Focus is the cursor: default lands on Go (the destination is
    // prefilled with the NPC's proposal, so one press of A confirms).
    // Up from the buttons enters the text box for keyboard users; Up/Down
    // inside the text box leaves it again — that was the trap where
    // controller users got stuck with the caret and had to grab the mouse.
    function suggestRows() {
      return Array.prototype.slice.call(suggestE.querySelectorAll('.tp-suggest-row'));
    }
    document.addEventListener('keydown', function (e) {
      var k = e.key;
      // Escape dismisses silently — same contract as the native escape
      // monitor. This DOM path is the one that works for VR controllers:
      // PrismaVR delivers controller cancel as a key event to the view,
      // where GetAsyncKeyState (the native monitor) never sees it.
      if (k === 'Escape') { e.preventDefault(); post('dismiss'); return; }
      if (k !== 'ArrowUp' && k !== 'ArrowDown' && k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'Enter') return;
      var f = document.activeElement;
      var rows = suggestRows();

      // Suggestion rows: Up/Down cycle, Enter picks (click handler fills)
      var rowIdx = rows.indexOf(f);
      if (rowIdx >= 0) {
        if (k === 'ArrowDown') { e.preventDefault(); (rows[rowIdx + 1] || goB).focus(); }
        else if (k === 'ArrowUp') { e.preventDefault(); (rows[rowIdx - 1] || destE).focus(); }
        else if (k === 'Enter') { e.preventDefault(); destE.value = f.textContent; hideSuggest(); goB.focus(); }
        return;
      }

      if (f === destE) {
        // Left/Right keep native caret movement; Up/Down escape the box.
        if (k === 'ArrowDown') { e.preventDefault(); if (rows.length) rows[0].focus(); else goB.focus(); }
        else if (k === 'ArrowUp') { e.preventDefault(); goB.focus(); }
        else if (k === 'Enter') { e.preventDefault(); if (destE.value.trim()) post('confirm'); }
        return;
      }

      if (f === goB || f === cancelB) {
        if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); (f === goB ? cancelB : goB).focus(); }
        else if (k === 'ArrowUp') { e.preventDefault(); destE.focus(); }
        // Explicit activation: Ultralight does NOT perform the browser
        // default of clicking a focused button on Enter, so the gamepad's
        // A (translated to Enter) silently did nothing here.
        else if (k === 'Enter') { e.preventDefault(); f.click(); }
        return;
      }

      // Nothing focused yet — first arrow press lands on Go.
      e.preventDefault();
      goB.focus();
    });

    window.receiveTravelPromptData = function (data) {
      data = data || {};
      posted = false;
      allLocations = data.allLocations || [];
      titleE.textContent = (data.npcName || 'Someone') + ' — where to?';
      destE.value = (data.namedPlace || '').toString();
      overlay.classList.add('show');
      // Default focus goes to Go, NOT the text box: the destination arrives
      // prefilled with the NPC's proposal, so the common case is one press of
      // A/Enter to confirm. Autofocusing the input trapped controller users
      // (caret ate the arrows and B closed the whole popup).
      setTimeout(function () { goB.focus(); }, 60);
      // Drain timer — lapse = decline (no travel).
      var ms = parseInt(data.timeoutMs, 10) || 60000;
      timerFill.style.transition = 'none';
      timerFill.style.width = '100%';
      void timerFill.offsetWidth;
      timerFill.style.transition = 'width ' + ms + 'ms linear';
      timerFill.style.width = '0%';
      if (timerHandle) clearTimeout(timerHandle);
      timerHandle = setTimeout(function () { post('decline'); }, ms);
    };

    if (window.travelPromptReady) window.travelPromptReady('');
  })();
</script>
  <!-- ml-ui-sounds: Magelight 0.29.0 button/hover sounds through the game's audio.
       Same logic as PrismaUI-frontend/src/lib/ui-sounds.ts (keep in step); no-op
       on PrismaUI, older Magelight and the browser. -->
  <script>
  (function () {
    var SEL = 'button,[role="button"],a[href],input[type="checkbox"],input[type="radio"],select,summary';
    var CANCEL_TEXT = /^(cancel|close|back|dismiss|not now|no|decline|\u00d7|\u2715|\u2716)$/i;
    var CANCEL_HINT = /(cancel|close|decline|dismiss|back)/i;
    function api() { var m = window.magelight; return (m && typeof m.sound === 'function') ? m : null; }
    function buttonOf(t) {
      var e = t;
      while (e && e.nodeType === 1) {
        if (e.hasAttribute('data-ml-sound') || e.hasAttribute('data-ml-sound-hover')) return null;
        if (e.matches && e.matches(SEL)) return e;
        e = e.parentNode;
      }
      return null;
    }
    function disabled(el) { return el.disabled === true || el.getAttribute('aria-disabled') === 'true'; }
    function clickName(el) {
      var text = (el.textContent || el.value || el.getAttribute('aria-label') || '').replace(/^\s+|\s+$/g, '');
      if (CANCEL_TEXT.test(text)) return 'cancel';
      return CANCEL_HINT.test((el.id || '') + ' ' + (el.getAttribute('class') || '')) ? 'cancel' : 'click';
    }
    var last = null;
    document.addEventListener('click', function (ev) {
      var m = api(); if (!m) return;
      var el = buttonOf(ev.target); if (!el || disabled(el)) return;
      m.sound(clickName(el));
    }, true);
    document.addEventListener('mouseover', function (ev) {
      var m = api(); if (!m) return;
      var el = buttonOf(ev.target); if (el === last) return;
      last = el; if (!el || disabled(el)) return;
      m.sound('hover:focus');
    }, true);
  })();
  </script>
</body>
</html>
