# Nested in Journeys (journeys.yaml): reachable only through that container.
customCategory: sa_journeys
name: CancelTravel
description: "Use when the speaker, already on the way to a destination, calls the trip off in this line: {{ player.name }} tells them to stop, turn back or not go after all, or they change their mind now. They stop where they are; a companion falls back in behind {{ player.name }}, anyone else returns to their routine. Not for a trip that has not started."
questEditorId: SeverActions
scriptName: SeverActions_Travel
executionFunctionName: CancelTravel
parameterMapping:
  - type: speaker
    name: akNPC
    description: the actor who's no longer going anywhere
  # SkyrimNet requires the mapping count to equal the FULL Papyrus parameter
  # count, defaults included — CancelTravel(Actor, Bool restoreFollower = true)
  # is 2 VM params, so this static pad is load-bearing (with 1 mapping the
  # dispatch was rejected before the call).
  - type: static
    value: true
    name: restoreFollower
    description: restore their following job after the trip is called off
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      # sever_is_traveling: "1" only while the actor is on the road (phase 1);
      # "" once they arrive and wait. String decorator, so gate on != "".
      # Deploy with the DLL that registers it.
      - decoratorName: "sever_is_traveling"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_tax_collector"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Guards in the middle of an SA arrest or dispatch. is_busy covers a live
      # one; this also covers the time after a load, when the task stands and
      # busy is not set again. Custom decorator, read by FormID: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
