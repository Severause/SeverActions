customCategory: crafting
name: CraftItem
description: "Use when a smith agrees in this line to forge a specific weapon or armor piece right now for someone who asked for it. They walk to the forge, work and hand it over; it costs nothing. Not for work to be collected later (CommissionItem), discussing or refusing a job, describing their own work at the forge, or selling a piece already in stock (Economy)."
questEditorId: SeverActions
scriptName: SeverActions_Crafting
executionFunctionName: CraftItem_Internal
parameterMapping:
  - type: speaker
    name: akActor
    description: the smith at the anvil
  - type: dynamic
    name: itemName
    description: "the weapon or armor as the game names it ('Iron Sword', 'Steel Armor')"
  - type: dynamic
    name: recipient
    description: "who receives it: exact name as listed in Nearby Actors, or the player's name"
  - type: dynamic
    name: itemCount
    description: "how many; above 1 only when several were asked for"
    optional: true
    default: 1
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
  - conditions:
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          # JobBlacksmithFaction (Skyrim.esm 0x0005091D). The hex FormID
          # string is the VR-safe form: SkyrimNet resolves a faction name
          # via LookupByEditorID, which returns nothing for FACT records
          # unless po3 Tweaks ("Keep EditorIDs") is installed -- and there
          # is no po3 build for Skyrim VR, so the EditorID form failed
          # closed there (blacksmiths could never craft). A hex string is
          # converted to numeric and takes the FormID path instead, which
          # works everywhere. Skyrim.esm sits at index 00, so the runtime
          # FormID equals this local one.
          - "0x0005091D"
        comparisonOperator: ==
        expectedValue: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
