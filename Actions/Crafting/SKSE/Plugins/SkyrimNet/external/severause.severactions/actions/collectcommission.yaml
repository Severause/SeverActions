customCategory: crafting
name: CollectCommission
description: "Use when {{ player.name }} has come for the finished order this smith or tailor is holding for them and wants it now. This one action shows the balance due, takes it and hands the item over, so no separate payment or hand-over is needed. Not while the order is only being mentioned or {{ player.name }} is putting the pickup off."
questEditorId: SeverActions
scriptName: SeverActions_Crafting
executionFunctionName: CollectCommission_Internal
parameterMapping:
  - type: speaker
    name: akActor
    description: the smith or tailor handing over the finished commission
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A smith (JobBlacksmithFaction, Skyrim.esm 0x0005091D) or a tailor
      # (JobTailorFaction, 0x000806A8), by hex FormID: the po3-free form (a
      # faction name needs po3 "Load EditorIDs", optional, and failed closed).
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          - "0x0005091D"
        comparisonOperator: "=="
        expectedValue: true
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          - "0x000806A8"
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "OR"
    required: true
  - conditions:
      # has_ready_commission returns the STRING "true"/"" — custom decorators are
      # wrapped as JSON strings, never bools (PublicRegisterDecorator only parses
      # the return to JSON when it contains '{'). SkyrimNet's EligibilityChecker
      # does a strict nlohmann compare, so `== true` (a JSON bool) can NEVER match
      # the JSON string "true" and the action would never be eligible. Gate on
      # "non-empty" instead: "" = no ready order, any text = a ready order.
      # DO NOT change this back to `== true`.
      - decoratorName: "has_ready_commission"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
