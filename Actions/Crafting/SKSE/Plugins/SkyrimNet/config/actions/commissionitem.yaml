customCategory: crafting
name: CommissionItem
description: "The speaker takes a deferred order — they can't forge it on the spot, but they'll have it ready in a few days. Use this when the smith agrees to make something and tells {{ player.name }} to come back for it later, usually naming a timeframe and asking for a deposit. Takes half the price up front; the rest is due when {{ player.name }} returns to collect. NOT for work done immediately (use CraftItem for that)."
questEditorId: SeverActions
scriptName: SeverActions_Crafting
executionFunctionName: CommissionItem_Internal
parameterMapping:
  - type: speaker
    name: akActor
    description: the smith taking the order
  - type: dynamic
    name: itemName
    description: "what's being commissioned (e.g. 'steel sword', 'dwarven armor')"
  - type: dynamic
    name: etaText
    description: "how long the smith says it'll take, in their own words (e.g. 'a couple days', 'about a week', 'tomorrow'). Phrase it naturally — the system converts this prose into the actual ready date, so match whatever the speaker just promised in dialogue."
  - type: dynamic
    name: itemCount
    description: "how many to make — leave empty (or 1) for a single piece. Only use > 1 when the request clearly asks for multiples (e.g. 'three steel daggers')."
    optional: true
    default: 1
  - type: dynamic
    name: quotedTotal
    description: "the TOTAL price in gold for the whole order, as a whole number — half is taken now as a deposit, half on pickup. Pass the same figure the speaker named in dialogue ('about eight hundred' -> 800). Price by material and effort: a steel sword a few dozen septims, ebony a few hundred, daedric over a thousand. Leave empty only if no price was named."
    optional: true
    default: 0
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          # JobBlacksmithFaction (Skyrim.esm 0x0005091D) by hex FormID — the
          # VR-safe form (name lookup needs po3 "Keep EditorIDs", absent on
          # VR, and failed closed: blacksmiths never matched). Mirrors the
          # documented fix in craftitem.yaml.
          - "0x0005091D"
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
