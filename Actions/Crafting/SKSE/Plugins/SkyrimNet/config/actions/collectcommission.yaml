customCategory: crafting
name: CollectCommission
description: "The speaker hands over a finished workshop commission {{ player.name }} has come back to collect. Use only when the 'Workshop Commissions' context lists an order as finished and ready to collect. This one action handles both the handover and the remaining payment — do NOT also call GiveItem, GiveGold, SellItem, or CollectPayment. If no order is listed as ready, do not call this; tell {{ player.name }} to come back later."
questEditorId: SeverActions
scriptName: SeverActions_Crafting
executionFunctionName: CollectCommission_Internal
parameterMapping:
  - type: speaker
    name: akActor
    description: the smith handing over the finished commission
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_faction"
        arguments:
          - currentActor
          # JobBlacksmithFaction (Skyrim.esm 0x0005091D) by hex FormID — the
          # VR-safe form (name lookup needs po3 "Keep EditorIDs", absent on
          # VR, and failed closed: blacksmiths never matched). Mirrors the
          # documented fix in craftitem.yaml.
          - "0x0005091D"
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_ready_commission returns the STRING "true"/"" — custom decorators are
      # wrapped as JSON strings, never bools (PublicRegisterDecorator only parses
      # the return to JSON when it contains '{'). SkyrimNet's EligibilityChecker
      # does a strict nlohmann compare, so `== true` (a JSON bool) can NEVER match
      # the JSON string "true" and the action would never be eligible. Gate on
      # "non-empty" instead: "" = no ready order, any text = a ready order.
      # DO NOT change this back to `== true`.
      - decoratorName: "has_ready_commission"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
