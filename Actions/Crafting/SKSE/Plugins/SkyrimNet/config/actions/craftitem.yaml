customCategory: crafting
name: CraftItem
description: "The speaker works the forge — hammer, tongs, quench — and hands the finished piece to whoever asked for it, on the spot. Use for work done immediately. NOT for an order the smith will finish later (use CommissionItem)."
questEditorId: SeverActions
scriptName: SeverActions_Crafting
executionFunctionName: CraftItem_Internal
parameterMapping:
  - type: speaker
    name: akActor
    description: the smith at the anvil
  - type: dynamic
    name: itemName
    description: "what's being forged (e.g. 'iron sword', 'steel armor')"
  - type: dynamic
    name: akRecipient
    description: the actor the finished piece is going to
  - type: dynamic
    name: itemCount
    description: "how many to forge — leave empty (or 1) for a single piece. Only use > 1 when the request clearly asks for multiples (e.g. 'three iron daggers')."
    optional: true
    default: 1
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
  - conditions:
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          # JobBlacksmithFaction (Skyrim.esm 0x0005091D). The hex FormID
          # string is the VR-safe form: SkyrimNet resolves a faction name
          # via LookupByEditorID, which returns nothing for FACT records
          # unless po3 Tweaks ("Keep EditorIDs") is installed -- and there
          # is no po3 build for Skyrim VR, so the EditorID form failed
          # closed there (blacksmiths could never craft). A hex string is
          # converted to numeric and takes the FormID path instead, which
          # works everywhere. Skyrim.esm sits at index 00, so the runtime
          # FormID equals this local one.
          - "0x0005091D"
        comparisonOperator: ==
        expectedValue: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
