customCategory: combat
name: Combat
description: "Category: a real fight with weapons or magic: attack someone this very moment, or end a fight the speaker is in by surrendering or calling a truce. Carrying on a fight already under way needs no action. Threats of what will happen, warnings, readying a weapon, 'prepare to fight' and 'if you…' are words; drawing steel and striking now is the attack. Fist-fights are Brawl; an outlaw questioning the player at their camp is CampChallenge; an ambush standoff is AmbushStandoff."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true