customCategory: sa_campchallenge
name: LetThemPass
description: "Only for the outlaw who stopped {{ player.name }} at their camp: the final verdict once the speaker has heard enough, when the answer holds up, {{ player.name }} seems useful or harmless, or a fight is not worth it. The speaker lowers their weapon and {{ player.name }} may move about the camp for this visit. Not while still questioning."
questEditorId: SeverActions
scriptName: SeverActions_Combat
executionFunctionName: LetThemPass_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the outlaw who challenged {{ player.name }}
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      - decoratorName: "camp_challenge_pending"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} lets {{ player.name }} through the camp for this visit"
