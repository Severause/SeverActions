customCategory: combat
name: Yield
description: "Surrender a real fight the speaker is losing and hope for mercy — a bandit who has lost the stomach for it, a wounded soldier sinking to one knee. For yielding a non-lethal brawl, use ForfeitBrawl."
questEditorId: SeverActions
scriptName: SeverActions_Combat
executionFunctionName: Yield_Execute
parameterMapping:
  - type: speaker
    name: akYielder
    description: the actor giving up the fight
enabled: true
defaultPriority: 8
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
