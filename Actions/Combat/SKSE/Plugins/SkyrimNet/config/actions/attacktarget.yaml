customCategory: combat
name: AttackTarget
description: "Attack the target with weapons and start a real fight. Use for lethal intent — ambushes, blood grudges, enemies on sight. For a non-lethal fist-fight challenge, use ChallengeBrawl."
questEditorId: SeverActions
scriptName: SeverActions_Combat
executionFunctionName: AttackTarget_Execute
parameterMapping:
  - type: speaker
    name: akAttacker
    description: the actor making the first move
  - type: dynamic
    name: akTarget
    description: the actor on the receiving end of the blade
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
