customCategory: magic
name: LearnSpell
description: "Use only when {{ player.name }} offers to teach the speaker a named spell and the speaker accepts in this line: {{ player.name }} is the teacher, the speaker the student, and the lesson starts now. Not for wishing to learn someday, admiring {{ player.name }}'s magic, or the speaker teaching (TeachSpell). {{ player.name }} must know the spell."
questEditorId: SeverActions
scriptName: SeverActions_SpellTeach
executionFunctionName: learnspell
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor taking the spell into their own hands
  - type: dynamic
    name: spellName
    description: "the spell the player is teaching, as named in the conversation (e.g. 'Fireball', 'Close Wounds', 'Oakflesh')"
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
