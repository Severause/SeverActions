customCategory: magic
name: Magic
description: "Category: magic cast or taught right now, outside a fight: cast a spell the speaker knows (heal a wound, light the way, raise a ward, strike a beast), teach the player a spell or learn one from them, or, for a master of the Voice, teach a word of a Shout. Only when the cast or the lesson happens in this line; readying a spell 'in case', boasts and lessons promised for later are words. Attacking a person to start a fight is Combat."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true