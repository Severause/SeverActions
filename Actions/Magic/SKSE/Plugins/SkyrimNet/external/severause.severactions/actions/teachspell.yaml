customCategory: magic
name: TeachSpell
description: "Use only when {{ player.name }} asks to learn a spell the speaker knows and the speaker agrees in this line, or the speaker offered and {{ player.name }} has just accepted; the lesson starts now, a short practice that can fail, or go wrong, on a harder spell. Not for talk about magic, an offer not yet accepted, or a lesson promised for later. Spells only; a Shout is TeachShout. The speaker learning from {{ player.name }} is LearnSpell."
questEditorId: SeverActions
scriptName: SeverActions_SpellTeach
executionFunctionName: TeachSpell
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor passing the spell on
  - type: dynamic
    name: spellName
    description: "the spell being taught, as listed under the speaker's known spells (e.g. 'Fireball', 'Close Wounds', 'Oakflesh')"
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
