customCategory: magic
name: StudySpellTome
description: "Use only when the speaker decides, in this line, to start studying a spell tome they carry, to learn its spell over the next hours of quiet reading. Their tomes: {{ sever_spell_tomes(npc.UUID) }}. One far beyond them may still be tried; they know it, and it can go badly. Not for reading a book aloud, or learning from {{ player.name }} (LearnSpell)."
questEditorId: SeverActions
scriptName: SeverActions_SpellTeach
executionFunctionName: StudySpellTome
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor who studies the tome
  - type: dynamic
    name: tomeName
    description: "the spell the tome teaches, or the tome's title, as the speaker carries it (e.g. 'Fireball', 'Spell Tome: Oakflesh')"
enabled: true
defaultPriority: 5

eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only for an NPC carrying a spell tome they could study (SpellTomes: a spell they do not know). Custom
      # decorator, so a STRING compare.
      - decoratorName: "sever_spell_tomes"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
