customCategory: items
name: GiveItem
description: "Use when the speaker hands items from their own pack (or, for a merchant, their shop stock) to someone in this line, holding them out or agreeing to a request for them: a gift, a loan, a draught pressed into a friend's hand. One call can hand out several. Not for an offer or promise for later, 'I could give you…', or selling (Economy). A courier's letter is handed over by itself; no action. If a receiver owes the speaker on an open tab, the items' value is added to it."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: GiveItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor parting with the item
  - type: dynamic
    name: recipient
    description: "the main person receiving: exact name as listed in Nearby Actors, or the player's name; an item with its own 'for' goes to that person instead"
  - type: dynamic
    name: item
    description: "the item as named in the speaker's inventory (e.g. 'Iron Sword', 'Health Potion', 'Sweet Roll'); several items comma-separated, each with an optional count before it and, to hand that one to someone else, 'for' and their exact name as listed in Nearby Actors, or the player's name, after it (e.g. 'Sweet Roll, 2 Health Potion for Rin'); copy the full name exactly as written in the inventory or object list, never as the player phrased it (player says 'эльфийские сапоги', the list has 'Стальные эльфийские лёгкие сапоги': pass 'Стальные эльфийские лёгкие сапоги'), keeping its capital first letter and every letter including ё"
  - type: dynamic
    name: count
    description: "how many, a whole number, 1 or more; with several items, put 1 here and each item's count before its name"
    optional: true
    default: 1
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
