customCategory: items
name: PickUpItem
description: "Use when the speaker decides or agrees to pick up a loose item lying nearby (see Nearby Objects) for themselves, now: a sword in the dirt, an apple under a table, a mountain flower by the road. Not for anything inside a chest, sack or body (LootContainer, LootCorpse), or fetching it for someone (BringItem). Taking something that belongs to someone else is theft; if seen, the speaker gets a bounty."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: PickUpItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor reaching down to grab it
  - type: dynamic
    name: item
    description: "name or kind of the loose item nearby (e.g. 'Iron Sword', 'potion', 'mountain flower')"
enabled: true
eligibilityRules:
  - conditions:
      # A traveler on the road: walking to the object would take them off it.
      - decoratorName: "sever_is_traveling"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
