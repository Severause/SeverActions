customCategory: items
name: BringItem
description: "Use when the speaker is asked to bring or fetch something lying loose nearby (see Nearby Objects) and agrees, or offers and does it now: they pick it up and carry one piece to that person. Not for something already in the speaker's pack (GiveItem), inside a chest or a body, not actually lying nearby, or telling someone else to fetch it. To keep it, PickUpItem. Taking something that belongs to someone else is theft; if seen, the speaker gets a bounty."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: BringItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor doing the fetching
  - type: dynamic
    name: recipient
    description: "who receives it: exact name as listed in Nearby Actors, or the player's name"
  - type: dynamic
    name: item
    description: "name or kind of the loose item to fetch (e.g. 'sword', 'potion', 'book')"
enabled: true
eligibilityRules:
  - conditions:
      # A traveler on the road: walking to the object would take them off it.
      - decoratorName: "sever_is_traveling"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
