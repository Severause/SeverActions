customCategory: items
name: StopReading
description: "Use when the speaker, reading aloud, has read to the end or finished sharing their thoughts on it, is told to stop, or something needs their attention: they close the book and put it away."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: StopReading_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor who has been reading and is now closing the book
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only while reading aloud: SeverActions_ReadingBook is 1 or 2 during a read (SeverActions_Loot).
      - decoratorName: "papyrus_util"
        arguments: ["GetIntValue", "currentActor", "SeverActions_ReadingBook", 0]
        comparisonOperator: ">"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
