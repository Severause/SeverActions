customCategory: sa_companionship
name: DismissFollower
description: "Use when {{ player.name }} tells the companion to go home or part ways now, or the companion agrees to that in this line: they leave {{ player.name }}'s company, head home, and can be asked back later. Not for waiting at this spot (WaitForPlayerHere), walking out in anger (FollowerLeaves), or a joke or 'maybe go home sometime'."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: DismissCompanion
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion being sent home
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
