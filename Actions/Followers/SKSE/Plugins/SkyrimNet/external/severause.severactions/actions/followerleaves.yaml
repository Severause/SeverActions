customCategory: sa_companionship
name: FollowerLeaves
description: "Very rare. Use only when the companion quits {{ player.name }}'s company for good in this line after long and serious mistreatment, a bond broken over many days, never one argument or insult; they walk out. Not for leaving a room or a place, going somewhere with {{ player.name }}, or an ordinary parting (DismissFollower)."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: FollowerLeaves
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion walking out for good
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
