customCategory: sa_companionship
name: AssignHome
description: "Use only when {{ player.name }} tells the companion that the place where the two of them stand right now is the companion's to live in. It becomes their home, where they go when dismissed and spend their nights, marked exactly where {{ player.name }} stands. Not for naming a place elsewhere, and not for talk about houses, deeds or titles."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: AssignHome
parameterMapping:
  - type: speaker
    name: akActor
    description: the follower putting down roots
  - type: dynamic
    name: homeName
    description: "the name of the place the companion and the player are both in right now, e.g. 'Breezehome'; the home is marked where the player stands, so never a place elsewhere"
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_sever_follower"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
