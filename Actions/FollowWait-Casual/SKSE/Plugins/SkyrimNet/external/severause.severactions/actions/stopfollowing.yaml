customCategory: sa_tagalong
name: StopFollowing
description: "Use when the speaker, who has been tagging along behind {{ player.name }}, stops and goes back to their own business: {{ player.name }} sends them off, or they decide in this line to go their own way. Not for waiting at this spot while staying with {{ player.name }} (Companionship)."
questEditorId: SeverActions
scriptName: SeverActions_Follow
executionFunctionName: StopFollowing
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor breaking off from {{ player.name }}
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Someone SeverActions walks or parks. An NPC walking along only through
      # SkyrimNet's own follow package, with no SeverActions row, is not offered
      # this; SkyrimNet's StopAccompanying releases them.
      - decoratorName: "sever_follow_state"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_sever_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
