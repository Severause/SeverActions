customCategory: sa_tagalong
name: StartFollowing
description: "Use when {{ player.name }} asks the speaker to come along now and the speaker agrees in this line to walk behind them for a while without joining as a companion: a friend coming to the inn, a curious local tagging along to see the ruin. Not for the speaker going ahead to a place (Journeys), and not for joining up for the long road (Companionship)."
questEditorId: SeverActions
scriptName: SeverActions_Follow
executionFunctionName: StartFollowing
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor falling in behind {{ player.name }}
enabled: true
eligibilityRules:
  - conditions:
      # Imperial tax collectors are loyal to the Empire alone — never
      # recruitable, by design (P2 Final Audit). String-compared custom
      # decorator: "" = not a collector.
      #
      # THIS RULE FAILS CLOSED, AND THAT IS DELIBERATE. SkyrimNet's
      # EligibilityChecker returns false for an UNREGISTERED decorator before
      # it ever compares, so if SeverActionsNative.dll is missing/stale (or
      # SkyrimNet is pre-API-v5) this action goes ineligible for EVERY NPC —
      # there is no fail-open formulation, inverting the operator behaves
      # identically. These YAMLs are therefore DLL-COUPLED exactly like a
      # prompt that calls a new decorator: ship them together, never alone.
      # Papyrus backstops the same rule natively with an in-world refusal.
      - decoratorName: "is_tax_collector"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not already walking with the player: not a teammate (here) and not
      # someone SeverActions walks or parks (next rule). Never is_in_faction on
      # CurrentFollowerFaction: it is rank-blind and would refuse every
      # dismissed ex-follower.
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_follow_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
