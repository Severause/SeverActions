customCategory: arrest
name: AppealDuringEscort
description: "Use only while the speaker is actively being escorted to jail: the prisoner makes a last plea — innocence, a bribe, mercy — and the escort halts to listen. The escorting guard then accepts or rejects the plea."
questEditorId: SeverActions
scriptName: SeverActions_Arrest
executionFunctionName: AppealDuringEscort_Internal
parameterMapping:
  - type: speaker
    name: akPrisoner
    description: the prisoner mid-escort making their case
enabled: true
defaultPriority: 8
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "busy_reason"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "arrest"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_faction"
        arguments: ["currentActor", "SeverActions_Arrested"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_faction"
        arguments: ["currentActor", "SeverActions_Jailed"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
