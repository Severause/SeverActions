customCategory: arrest
name: GoQuietly
description: "Only for a companion a guard has stopped over their bounty: in this line the speaker gives in and goes with the guard to jail, to serve the sentence and come back to {{ player.name }} afterwards. Not for saying they might, or for stalling; only the moment they truly submit."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: GoQuietly_Internal
parameterMapping:
  - type: speaker
    name: akSuspect
    description: the companion answering the guard
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      # The parley markers (ParleyCore.h, sever_parley_state): keep them byte-identical there.
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "[PARLEY: ANSWER THE CHARGE]"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md). "" = not a victim.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
