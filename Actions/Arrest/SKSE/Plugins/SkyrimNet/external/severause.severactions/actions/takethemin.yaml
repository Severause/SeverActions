customCategory: arrest
name: TakeThemIn
description: "Only for the guard questioning one of {{ player.name }}'s companions over a bounty: they have heard enough and demand an answer now (pay, come quietly or refuse), and with no answer they take the companion in. Not for threats while the talk goes on; only when the guard ends it in this line."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: TakeThemIn_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard questioning the companion
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      # The parley markers (ParleyCore.h, sever_parley_state): keep them byte-identical there.
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "[PARLEY: HEARING THE PLEA]"
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "[PARLEY: AWAITING THEIR ANSWER]"
    logicalOperator: "OR"
    required: true
  - conditions:
      # Once the demand stands the action is spent (ParleyCore's kMarkDemand).
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "not_contains"
        expectedValue: "[DEMAND]"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md). "" = not a victim.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
