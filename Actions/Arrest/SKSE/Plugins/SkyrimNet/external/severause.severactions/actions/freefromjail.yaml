customCategory: arrest
name: FreeFromJail
description: "Use when the speaker decides in this line to release a nearby NPC locked in this hold's cells (sentence served, pardon, charges dropped, a favor granted): they walk to the cell, unlock it, and the prisoner returns to their life. Not for a promise to release them later. Paying their bounty (PayNpcBountyToGuard) does not open the cell; this does. A prisoner brought in for judgment is OrderRelease; one being marched to jail is AcceptEscortPlea."
questEditorId: SeverActions
scriptName: SeverActions_Arrest
executionFunctionName: FreeNPC_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard turning the key
  - type: dynamic
    name: prisoner
    description: "exact name of the jailed NPC to free, who must be nearby (as listed in Nearby Actors)"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  # Replaced an 11-condition OR ladder (9 GuardFactionX + JobJarlFaction
  # + JobHousecarlFaction) with the single native is_guard_or_authority
  # decorator. Same semantics — see SkyrimNetBridge.h for the cached
  # faction-pointer set, plus mod-added holds via HoldResolver.
  - conditions:
      - decoratorName: "is_guard_or_authority"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a guard in the middle of an SA arrest or dispatch. sever_is_dispatched
      # reads the arrest store by FormID (the dispatch faction named by EditorID
      # never resolves on VR). Custom decorator, so a STRING compare: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "hold_jail_roster"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
