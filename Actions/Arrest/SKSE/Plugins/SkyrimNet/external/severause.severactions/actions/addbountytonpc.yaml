customCategory: arrest
name: AddBountyToNPC
description: "Use when the speaker charges someone here other than {{ player.name }} with a crime they saw them commit here and now (a companion caught stealing, a brawler, a vandal), adding gold to that person's own bounty in this hold. Not for crimes only mentioned, joked about, told as a past story or merely suspected. The charge stops no one: taking them in is ArrestNPC, in a later line. {{ player.name }}'s own crimes are AddBountyToPlayer."
questEditorId: SeverActions
scriptName: SeverActions_ArrestBounty
executionFunctionName: AddBountyToNPC_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard writing the charge into the books
  - type: dynamic
    name: suspect
    description: "exact name of the person charged, who must be nearby (as listed in Nearby Actors); never the player"
  - type: dynamic
    name: bountyAmount
    description: "gold to add for the charge: assault 40-200, theft 75-300, murder 1000-3000, trespass 75-150, pickpocket 25-175, contempt 25-100, abuse_of_power 50-250; another crime by its severity, 25 for a petty one to 3000 for the gravest"
  - type: dynamic
    name: crimeType
    description: "the charge: one of assault, theft, murder, trespass, pickpocket, contempt (open defiance of the speaker), abuse_of_power; only when none of these fits, the crime in one to three words (arson, smuggling, necromancy)"
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_guard_or_authority"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a guard in the middle of an SA arrest or dispatch. Custom decorator, so a STRING compare: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md). "" = not a victim.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
