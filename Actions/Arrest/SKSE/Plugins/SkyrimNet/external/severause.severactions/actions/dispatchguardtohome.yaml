customCategory: arrest
name: DispatchGuardToHome
description: "Use when the speaker, a guard, is ordered in this line to search a named person's home for evidence of a stated suspicion (skooma, necromancy, stolen goods, Talos worship), or commits to going now. The guard leaves at once and comes back to whoever ordered it with what they found; nobody is arrested by it, and it is the action for any such search. Not for merely voicing suspicion. To bring the person in, DispatchGuardToArrest."
questEditorId: SeverActions
scriptName: SeverActions_Arrest
executionFunctionName: DispatchGuardToHome_Execute
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard heading out on the search
  - type: dynamic
    name: targetName
    description: "full name of the person whose home is searched, exactly as known"
  - type: dynamic
    name: senderName
    description: "name of whoever ordered the search and receives the findings, or 'player'; leave empty for the player"
    optional: true
    default: ""
  - type: dynamic
    name: reason
    description: "what to look for, e.g. skooma dealing, necromancy, Talos worship, thieving"
    optional: true
    default: "suspicious activity"
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  # is_guard, not is_guard_or_authority: this is the physical collar, and a
  # jarl or housecarl who could see it went and made the arrest in person
  # (DizzyDedman, 2026-09-12). They get OrderArrest instead, which hands
  # the job to the nearest guard.
  - conditions:
      - decoratorName: "is_guard"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a guard in the middle of an SA arrest or dispatch. sever_is_dispatched
      # reads the arrest store by FormID (the dispatch faction named by EditorID
      # never resolves on VR). Custom decorator, so a STRING compare: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
