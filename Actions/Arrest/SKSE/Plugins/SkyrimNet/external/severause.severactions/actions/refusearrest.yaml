customCategory: arrest
name: RefuseArrest
description: "Only for a companion a guard has stopped over their bounty: in this line the speaker refuses to be taken and fights back (draws a weapon on the guard, strikes them, or makes to break away by force). The guard fights them, their bounty grows, and if beaten they go to jail anyway. Not for arguing the charge or refusing to pay; only an open refusal to go."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: RefuseArrest_Internal
parameterMapping:
  - type: speaker
    name: akSuspect
    description: the companion answering the guard
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      # The parley markers (ParleyCore.h, sever_parley_state): keep them byte-identical there.
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "[PARLEY: ANSWER THE CHARGE]"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md). "" = not a victim.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
