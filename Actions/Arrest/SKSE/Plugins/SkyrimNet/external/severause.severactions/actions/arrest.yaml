customCategory: arrest
name: Arrest
description: "Category: the law, when the speaker takes a legal step in this line: charge the player with a crime or confront them over their bounty; arrest someone here, or have a guard do it; send a guard to bring in, or search the home of, someone elsewhere; free someone from the cells; take the player's coin to clear another person's bounty; or give the verdict in a hearing under way (the player arguing off a bounty, a prisoner pleading on the march, a prisoner brought in for judgment). A prisoner on the march picks this once, to plead. Suspicions, warnings and threats of arrest are words. Seizing someone to keep is Captives."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true