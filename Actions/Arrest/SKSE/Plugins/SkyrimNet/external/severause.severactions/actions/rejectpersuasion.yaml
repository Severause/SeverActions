customCategory: arrest
name: RejectPersuasion
description: "Only for the guard confronting {{ player.name }} over a bounty after {{ player.name }} chose to talk their way out: the case does not convince them. The bounty stands and {{ player.name }} must face the arrest, with no second try at arguing. Give this verdict once the case has been made; while still listening, just talk. Convinced instead: AcceptPersuasion."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: RejectPersuasion_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard unmoved by {{ player.name }}'s case
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  # is_guard, not is_guard_or_authority: the verdict belongs to the guard
  # confronting the player, and ArrestPlayer is offered to guards only.
  - conditions:
      - decoratorName: "is_guard"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a guard in the middle of an SA arrest or dispatch. sever_is_dispatched
      # reads the arrest store by FormID (the dispatch faction named by EditorID
      # never resolves on VR). Custom decorator, so a STRING compare: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
