customCategory: arrest
name: PressTheCharge
description: "Only for the guard questioning one of {{ player.name }}'s companions over a bounty: in this line they reject the companion's excuses, and the companion must now pay, come quietly or refuse. Give it once the case is made, not on the first line; moved by it: DropTheCharge. To end the talk at once: TakeThemIn."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: PressTheCharge_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard questioning the companion
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      # The parley markers (ParleyCore.h, sever_parley_state): keep them byte-identical there.
      - decoratorName: "sever_parley_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "[PARLEY: HEARING THE PLEA]"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md). "" = not a victim.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
