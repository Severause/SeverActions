customCategory: arrest
name: ArrestPlayer
description: "Use when the speaker decides in this line to enforce the bounty {{ player.name }} already owes in this hold and demands they answer for it now; {{ player.name }} then chooses: pay a small fine, or for a large one submit, resist, bribe or argue. Not for warnings or threats of arrest. If {{ player.name }} owes nothing here, the crime must be charged first (AddBountyToPlayer). An NPC is ArrestNPC."
questEditorId: SeverActions
scriptName: SeverActions_ArrestPlayer
executionFunctionName: ArrestPlayer_Internal
parameterMapping:
  - type: speaker
    name: akGuard
    description: the guard pressing the bounty
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  # is_guard, not is_guard_or_authority: this is the physical collar, and a
  # jarl or housecarl who could see it went and made the arrest in person
  # (DizzyDedman, 2026-09-12). They get OrderArrest instead, which hands
  # the job to the nearest guard.
  - conditions:
      - decoratorName: "is_guard"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a guard in the middle of an SA arrest or dispatch. sever_is_dispatched
      # reads the arrest store by FormID (the dispatch faction named by EditorID
      # never resolves on VR). Custom decorator, so a STRING compare: "" = free.
      - decoratorName: "sever_is_dispatched"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "tracked_bounty"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
