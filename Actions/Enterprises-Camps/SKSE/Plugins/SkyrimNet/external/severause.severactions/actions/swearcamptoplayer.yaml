customCategory: sa_outlawcamp
name: SwearCampToPlayer
description: "Use when the speaker, chief of an outlaw camp, has just agreed to terms in this conversation: their whole camp will serve {{ player.name }} as its patron. The camp keeps its ground and its work and sends {{ player.name }} a share of what it takes. Hard to undo. Not while the chief is still weighing it, bargaining, demanding a toll, or just being friendly."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: SwearCampToPlayer
parameterMapping:
  - type: speaker
    name: akActor
    description: the camp leader agreeing that their camp will serve {{ player.name }}
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # Feature gate. Disabling camp takeover empties this decorator, which
      # removes the action from the eligible list entirely — rather than
      # leaving it offered and silently refused by the native.
      - decoratorName: "sever_camp_takeover"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Custom decorators are string-compared — never gate on a JSON bool.
      # "wild" = an ordinary camp that has not sworn and has not lost its chief.
      - decoratorName: "sever_camp_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "wild"
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only the chief can sign the camp over. The native refuses a non-leader
      # too; this keeps the action from being offered at all.
      - decoratorName: "sever_camp_is_leader"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} agreed that their camp will serve {{ player.name }}"
