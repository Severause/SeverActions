customCategory: sa_outlawcamp
name: OutlawCamp
description: "Category: an outlaw camp's oath of service to the player: the chief swears the whole camp to the player; in a camp with no chief, one member at a time gives their word; the chief of a sworn camp rallies the war band or sends it home; the camp leaves service, released by the player or renounced by its chief. Only when one of these is decided in this exchange; bargaining, grumbling and threats to leave are words. Not pitching a campsite (Camping), a stranger questioned at the camp's edge (CampChallenge), or hiring one person (Employment)."
enabled: true

eligibilityRules:
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md).
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true