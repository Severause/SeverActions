customCategory: sa_outlawcamp
name: ReleaseCampFromService
description: "Use when {{ player.name }} tells the speaker's sworn camp, in this exchange, that it is released from service. Every member comes off {{ player.name }}'s books and keeps what it has, and the camp answers to nobody again. Not when the camp is complaining, bargaining or threatening to leave, or {{ player.name }} only muses about cutting them loose."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: ReleaseCampFromService
parameterMapping:
  - type: speaker
    name: akActor
    description: a member of the sworn camp {{ player.name }} is releasing
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # Feature gate. Disabling camp takeover empties this decorator, which
      # removes the action from the eligible list entirely — rather than
      # leaving it offered and silently refused by the native.
      - decoratorName: "sever_camp_takeover"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a camp that actually swore can be released.
      - decoratorName: "sever_camp_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "sworn"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} released {{ actor.name }}'s camp from service"
