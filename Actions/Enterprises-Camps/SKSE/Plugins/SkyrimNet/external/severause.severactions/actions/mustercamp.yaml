customCategory: sa_outlawcamp
name: MusterCamp
description: "Use when the speaker, chief of a camp sworn to {{ player.name }}, agrees to rally the whole crew now, for a raid, a march or a fight that needs every blade. Every living member gathers to {{ player.name }} and follows as a war band until sent home. Not for a promise to come when called, a lone volunteer, or plans for later."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: MusterCamp
parameterMapping:
  - type: speaker
    name: akActor
    description: the CHIEF of the sworn camp rallying their people
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # Feature gate — same rationale as the other takeover actions.
      - decoratorName: "sever_camp_takeover"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_camp_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "sworn"
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only the chief rallies the camp — string-compared "1".
      - decoratorName: "sever_camp_is_leader"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "1"
    logicalOperator: "AND"
    required: true
  - conditions:
      # Already mustered → this action leaves the list; SendCampHome shows.
      - decoratorName: "sever_camp_mustered"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} rallied the camp — the whole crew musters to {{ player.name }}'s side as a war band"
