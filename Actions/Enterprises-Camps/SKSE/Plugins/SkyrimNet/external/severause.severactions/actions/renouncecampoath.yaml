customCategory: sa_outlawcamp
name: RenounceCampOath
description: "Use when the speaker, chief of a camp sworn to {{ player.name }}, breaks the oath in this line because {{ player.name }} betrayed the camp, killed its people, took what was theirs or shamed the chief past bearing. The camp leaves service and every member turns hostile at once: a real fight that cannot be undone. Not for grumbling, hard bargaining, a warning or a threat of what they will do."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: RenounceCampOath
parameterMapping:
  - type: speaker
    name: akActor
    description: the CHIEF of the sworn camp renouncing the oath
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # Feature gate. Disabling camp takeover empties this decorator, which
      # removes the action from the eligible list entirely — rather than
      # leaving it offered and silently refused by the native.
      - decoratorName: "sever_camp_takeover"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a camp that actually swore has an oath to break.
      - decoratorName: "sever_camp_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "sworn"
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only the chief speaks for the camp — string-compared "1", never a
      # JSON bool (custom decorators are string-compared by the checker).
      - decoratorName: "sever_camp_is_leader"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "1"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} renounced their camp's oath to {{ player.name }} — the camp is hostile"
