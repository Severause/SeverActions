name: CompanionFollow
description: "A companion who was told to wait here earlier shoulders their pack and falls back in step. Use only for a waiting companion resuming travel. NOT for re-recruiting a dismissed companion — use SetCompanion. NOT for someone already following."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: CompanionFollow
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion picking up the road again
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} stopped waiting and is following {{ player.name }} again"
isShortLived: true
