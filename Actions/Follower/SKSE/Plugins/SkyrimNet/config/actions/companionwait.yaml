name: CompanionWait
description: "The speaker waits here until {{ player.name }} returns, wandering nearby on their own business. Use when {{ player.name }} asks them to wait, stay, or hold this spot. NOT a farewell — use DismissFollower for parting ways."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: CompanionWait
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion staying put
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} is waiting here for {{ player.name }}"
isShortLived: true
