name: DismissFollower
description: "Part ways with this companion for now: they head home and can be re-recruited later. Use for an amicable parting. NOT for waiting on a spot (use CompanionWait) and NOT for the companion quitting for good (use FollowerLeaves)."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: DismissCompanion
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion being sent home
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} has parted ways with {{ player.name }}"
isShortLived: true
