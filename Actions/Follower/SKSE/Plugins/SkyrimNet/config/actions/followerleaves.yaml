name: FollowerLeaves
description: "The companion quits for good after severe, sustained mistreatment — drops the pack and walks out. EXTREMELY RARE: only when the relationship has collapsed over time, never for one argument. For a normal parting use DismissFollower."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: FollowerLeaves
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion walking out for good
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} has decided to leave {{ player.name }}'s service"
