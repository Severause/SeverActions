name: SetCombatStyle
description: "{{ player.name }} tells the companion how to fight from now on — hold the front, hang back at range, or focus on keeping allies healed. The companion adjusts their stance, drawn weapon, and discipline to match."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: SetCombatStyle
parameterMapping:
  - type: speaker
    name: akActor
    description: the companion taking the new orders
  - type: dynamic
    name: style
    description: "how they fight. One of: aggressive (presses hard), defensive (holds and counters), ranged/archer (bow, hangs back), healer (restoration support - heals hurt allies, hangs back), balanced (mixed, sensible default), melee (weapons up close), berserker (reckless all-out), tank (soaks hits up front), mage (spells at range), spellsword (blade + spell), battlemage (armored caster), champion (duelist, seeks the strongest foe), brawler (fists), companion (the vanilla default style - NOT a special mode for companions), coward (non-combatant: flees, never fights - a scholar or bard, not a cautious fighter). Passing anything else reverts them to no combat style."
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: true
      - decoratorName: "is_in_faction"
        arguments: ["currentActor", "SeverActions_ActivelyFollowing"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: "OR"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} will now fight in a {{ style }} style"
