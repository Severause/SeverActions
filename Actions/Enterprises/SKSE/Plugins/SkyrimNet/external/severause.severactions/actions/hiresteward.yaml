customCategory: employment
name: HireSteward
description: "Use when {{ player.name }} appoints the speaker, one of their retainers, steward of their hold and the speaker accepts, in this exchange. From then on the hold's other retainers pay their weekly take into the steward's vault, so {{ player.name }} collects the whole hold from one person; the steward keeps 15 of every hundred gold collected instead of a wage. One steward per hold: if the seat is taken, nothing happens. Not for an offer still under discussion or a someday idea."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: HireSteward
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer accepting the stewardship of their hold
  - type: static
    name: aiWeeklyWage
    value: 100
    description: "unused: a steward is paid from their share of the takings"
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Must already be a retainer of the player's.
      - decoratorName: "retainer_status"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not already stewarding a hold.
      - decoratorName: "is_steward"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a retainer turned hostile: "hostile" passes the != "" test above.
      - decoratorName: "retainer_status"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: "hostile"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
