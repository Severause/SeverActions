customCategory: sa_taxes
name: Taxes
description: "Category: the tax on the player's businesses: a jarl eases or raises the hold's rate; an Imperial Treasury collector ends the Final Audit by taking the assessed payment or by force. Only when that decision is made in this exchange, not while it is still argued, asked about or threatened."
enabled: true

eligibilityRules:
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md).
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true