customCategory: employment
name: GrantLoan
description: "Use when {{ player.name }} agrees, in this exchange, to lend the speaker the sum they asked for. The gold leaves {{ player.name }}'s purse now, and the speaker repays it from their own weekly earnings; {{ player.name }}'s cut is untouched. Nothing happens if {{ player.name }} is short of the sum. Not for sympathy, let-me-think, or a promise to lend later."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: GrantLoan
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer being lent the coin they asked for
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_loan_ask returns the amount asked for; "" when nothing is pending.
      # Custom decorators are string-compared, so gate on empty vs non-empty.
      - decoratorName: "has_loan_ask"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
