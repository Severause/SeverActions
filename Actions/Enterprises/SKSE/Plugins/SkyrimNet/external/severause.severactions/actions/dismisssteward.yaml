customCategory: employment
name: DismissSteward
description: "Use when {{ player.name }} relieves the speaker of their hold stewardship, in this exchange. The vault's gold goes to {{ player.name }} at once; the speaker stays a retainer at their old work, and the hold's retainers keep their own takings until a new steward is named. Not for a complaint, a warning, or thinking aloud about replacing them."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: DismissSteward
parameterMapping:
  - type: speaker
    name: akActor
    description: the steward being relieved of the post
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # is_steward returns "" (not a steward) or the hold's name.
      - decoratorName: "is_steward"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} stepped down as {{ player.name }}'s hold steward and handed back the vault"
