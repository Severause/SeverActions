customCategory: sa_taxes
name: RaiseHoldTaxes
description: "Use when the speaker, as jarl, decides in this line to raise the hold's tax on {{ player.name }}'s businesses as a real punishment: {{ player.name }} insulted, threatened or defied them, or their enterprises take too much from the hold. Raises the rate by about 5 points, and it lasts. Not for irritation, disagreement, or a warning of what the jarl might do."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: RaiseHoldTaxes
parameterMapping:
  - type: speaker
    name: akActor
    description: the jarl raising the taxes
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # "" for non-jarls and while hold taxes are off.
      - decoratorName: "hold_tax_rate"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "Jarl {{ actor.name }} raised the hold's taxes on {{ player.name }}'s enterprises"
