customCategory: employment
name: PayArrears
description: "Use when {{ player.name }} pays the speaker, their retainer, the back-wages owed from weeks {{ player.name }} could not cover, handing the coin over now. Pays as much as {{ player.name }} carries; clearing it all restores the retainer's standing and some loyalty. Not for a promise to pay later. Money the speaker owes {{ player.name }} is a loan (ForgiveLoan), not this."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: PayArrears
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer being paid the back-wages they're owed
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_arrears returns "" (nothing owed) or the owed amount string.
      - decoratorName: "has_arrears"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} paid {{ actor.name }} back-wages"
