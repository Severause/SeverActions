customCategory: sa_taxes
name: PressTheDemand
description: "Use when {{ player.name }} refuses the Final Audit outright, mocks or denies the Treasury's authority, threatens the detail or draws a weapon, or is still dodging after the second and final demand. The detail attacks {{ player.name }}: the audit ends in blood and cannot be undone. Not while {{ player.name }} is still answering or asking about the assessment. The General's call; his escort acts only if he has fallen."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: PressTheDemand
parameterMapping:
  - type: speaker
    name: akActor
    description: the collector pressing the demand
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_tax_collector"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "tax_audit_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "demanding"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} declared the audit closed — the Imperial Treasury collects from {{ player.name }} by force"
