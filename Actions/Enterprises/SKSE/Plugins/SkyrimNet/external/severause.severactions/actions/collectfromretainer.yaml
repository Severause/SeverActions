customCategory: employment
name: CollectFromRetainer
description: "Use when {{ player.name }} asks the speaker, their retainer, to hand over what they have earned since the last collection, now. The gold and goods pass to {{ player.name }} at once; a steward hands over the hold vault too. A retainer openly withholding tribute backs down and pays when {{ player.name }} comes to take it in person. Not for asking how business is going, or saying they will collect later."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: CollectFromRetainer
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer handing over their accumulated earnings
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_pending_payout returns "" (nothing) or the pending amount string.
      - decoratorName: "has_pending_payout"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} handed over their earnings to {{ player.name }}"
