customCategory: employment
name: RefuseLoan
description: "Use when {{ player.name }} clearly says no to the speaker's request for a loan, in this exchange. It costs loyalty, and they will not ask again for a long while. Not while {{ player.name }} is still weighing it or putting them off; then do nothing and the request stands."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: RefuseLoan
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer whose request for a loan was turned down
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_loan_ask returns the amount asked for; "" when nothing is pending.
      - decoratorName: "has_loan_ask"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} refused {{ actor.name }}'s request for a loan"
