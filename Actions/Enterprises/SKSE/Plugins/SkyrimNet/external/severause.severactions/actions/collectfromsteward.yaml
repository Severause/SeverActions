customCategory: employment
name: CollectFromSteward
description: "Use when {{ player.name }} asks the speaker, their hold steward, for the hold's takings now. The whole vault passes to {{ player.name }} at once. Not for asking how the books stand or saying they will collect later. If the steward's own earnings are also waiting, CollectFromRetainer takes both in one go."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: CollectFromSteward
parameterMapping:
  - type: speaker
    name: akActor
    description: the steward handing over the hold vault
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # steward_vault_pending is a STRING decorator ("1" when this steward's
      # vault holds gold) - the has_pending_payout pattern for stewards.
      # Without it the only guard was descriptive text stage 2 may never
      # render. Deploys together with the DLL that registers it.
      - decoratorName: "steward_vault_pending"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # is_steward returns "" (not a steward) or the hold's name.
      - decoratorName: "is_steward"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} handed the hold's takings over to {{ player.name }}"
