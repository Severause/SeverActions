customCategory: sa_taxes
name: CollectAuthorizedTaxes
description: "Use when {{ player.name }} agrees to pay the Final Audit's assessed back-taxes, or hands over the coin: the full sum leaves {{ player.name }}'s purse and the audit detail stands down. A grudging or sarcastic yes counts; a question, a deflection or a stall does not. If {{ player.name }} is short of the sum, the demand stands. The General's call; his escort acts only if he has fallen."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: CollectAuthorizedTaxes
parameterMapping:
  - type: speaker
    name: akActor
    description: the collector accepting the payment
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_tax_collector"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "tax_audit_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "demanding"
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
# No eventString: CollectAuthorizedTaxes records final_audit_paid or final_audit_short itself,
# and a line here would also be written when the player is short and nothing is paid.
