customCategory: employment
name: DismissRetainer
description: "Use when {{ player.name }} ends the speaker's work for them, in this exchange: their venture closes and they go back to their old life. Earnings still waiting for collection and unpaid back-wages are dropped with it. Not for a threat or warning of dismissal, a complaint, or parting with a companion who travels with {{ player.name }} (Companionship)."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: DismissRetainer
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer being let go from {{ player.name }}'s service
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # retainer_status is "" for no retainer or a deserter.
      - decoratorName: "retainer_status"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Not a retainer turned hostile: "hostile" passes the != "" test above.
      - decoratorName: "retainer_status"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: "hostile"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} is no longer in {{ player.name }}'s service"
