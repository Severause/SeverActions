customCategory: employment
name: GrantRetainerRaise
description: "Use when {{ player.name }} clearly commits, in this exchange, to better pay or easier terms for the speaker: the raise they asked for, refused terms made good, or a smaller tribute cut. The wage or split changes now; skimming or withholding stops and any notice to quit is withdrawn. Not for we'll-see or later (at best ReassureRetainer), or a counter-offer below what they asked (NegotiateTerms). Does nothing for an enslaved retainer, who has no wage or cut."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: GrantRetainerRaise
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer whose pay or terms {{ player.name }} agreed to improve
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # retainer_grievance is non-empty when they hold a grievance, have a
      # pending raise ask, or a hearing is armed — string-compared, never bool.
      - decoratorName: "retainer_grievance"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} agreed to better terms for {{ actor.name }}'s work"
