customCategory: employment
name: ReassureRetainer
description: "Use when {{ player.name }}, face to face, sincerely takes up the speaker's grievance about their work: an apology, a real promise, an honest reckoning, with no change to pay or terms. On fair terms it clears the air and withdraws a notice to quit; on coerced terms it only cows them for a week. Not for flattery, platitudes or small talk; a firm commitment to better pay is GrantRetainerRaise. Use this or BrushOffRetainer at most once per conversation."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: ReassureRetainer
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer being reassured (or cowed)
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # retainer_grievance returns "" when content (or not a retainer) —
      # string-compared eligibility, never a bool.
      - decoratorName: "retainer_grievance"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} heard out {{ actor.name }}'s grievance about their work"
