customCategory: employment
name: BrushOffRetainer
description: "Use when {{ player.name }}, face to face, waves away, mocks or threatens the speaker's grievance about their work, or answers it with hollow words and a change of subject. The grievance hardens: morale drops, a free retainer may give notice on the spot, a tribute payer turns openly defiant. Not for small talk that never touches the grievance. Use this or ReassureRetainer at most once per conversation."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: BrushOffRetainer
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer whose grievance was dismissed
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # retainer_grievance is non-empty when they hold a grievance OR a
      # Send-Word hearing is armed — string-compared, never a bool.
      - decoratorName: "retainer_grievance"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} brushed aside {{ actor.name }}'s grievance about their work"
