customCategory: employment
name: NegotiateTerms
description: "Use when {{ player.name }} answers the speaker's request for better terms with a counter-offer (less than asked, or splitting the difference) and the speaker accepts it in this exchange. They get about half of what they asked, stop pressing, and goodwill rises a little. Not for a flat yes (GrantRetainerRaise), a no, or let-me-think-about-it, and never to open a negotiation they did not start."
questEditorId: SeverActions
scriptName: SeverActions_Enterprises
executionFunctionName: NegotiateTerms
parameterMapping:
  - type: speaker
    name: akActor
    description: the retainer {{ player.name }} is haggling terms with
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # has_raise_ask is non-empty ONLY while a raise ask is outstanding —
      # string-compared, never bool. Narrower than retainer_grievance (which
      # also covers hearings and plain grudges): there is nothing to split the
      # difference on unless they actually asked for something.
      - decoratorName: "has_raise_ask"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} haggled {{ actor.name }} down to a compromise on their terms"
