customCategory: employment
name: HireRetainer
description: "Use when the conversation has led the speaker to AGREE to work for {{ player.name }} running an off-screen venture — a mine, a shop or trade stall, an alchemy bench, a farm, a fencing operation, a mercenary contract, guard duty, lumber work, a forge (blacksmith), hunting and trapping, a brewhouse or meadery, a tannery, or working as a courtesan (selling companionship). The speaker becomes a 'retainer' who produces gold and goods every week while {{ player.name }} is away. The agreement may be WILLING or COERCED (a tribute arrangement extracted under pressure still counts as agreement). This opens a brief prompt for {{ player.name }} to confirm where they'll work and the terms. Only call once both sides have settled on WHAT work they'll do and HOW the money flows. Do NOT call it for vague musings, for someone who already works for {{ player.name }}, or to recruit a combat follower (that is a separate action)."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: HireRetainer
parameterMapping:
  - type: speaker
    name: akActor
    description: the NPC agreeing to become {{ player.name }}'s retainer
  - type: dynamic
    name: job
    description: "the work they agreed to do. One of: miner, merchant, alchemist, farmer, fence, mercenary, courtesan, guard, lumberjack, blacksmith, hunter, brewer, tanner. (Fence = moving and laundering stolen goods on the black market — illegal, draws the law over time. Courtesan = selling companionship, a prostitute/escort. Mercenary = sellsword/contracts; Guard = standing watch / gate duty; Lumberjack = felling timber at a mill; Blacksmith = forge work, arms and armor; Hunter = game, pelts and trapping; Brewer = mead/ale/wine; Tanner = hides into leather.)"
  - type: dynamic
    name: arrangement
    description: "how the money works. One of: employed (player pays a fixed weekly wage and keeps all output), partnership (no wage; earnings split 50/50), tribute (COERCED — they hand {{ player.name }} a cut under duress; accepts 'indentured', 'vassalage'), sworn (wage for service alone — a kept guard, bodyguard, or servant; accepts 'retained'), enslaved (COERCED and UNPAID captive; accepts 'slave', 'thrall', 'captive'). Default 'employed' for a normal willing hire."
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # retainer_status == "" means "not already a retainer". Custom decorators
      # return JSON strings, never bools — gate on empty vs non-empty, never == true.
      - decoratorName: "retainer_status"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} agreed to work for {{ player.name }} as a {{ job }}"
