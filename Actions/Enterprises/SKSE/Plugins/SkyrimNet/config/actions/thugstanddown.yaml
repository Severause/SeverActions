customCategory: employment
name: ThugStandDown
description: "Use only when the speaker is one of the hired thugs confronting {{ player.name }} in an ambush, and the exchange has given them a real reason to back off - {{ player.name }} paid them off, intimidated them, or talked them down. Everyone lowers their weapons and leaves {{ player.name }} unharmed. The thugs owe their employer nothing once the price or the risk no longer adds up. Do not call this if the speaker still means to fight, and never out of an ordinary conversation - it only resolves the ambush peacefully."
questEditorId: SeverActions
scriptName: SeverActions_Travel
executionFunctionName: ThugStandDown_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the thug calling off the ambush
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      # is_ambush_thug returns "1" only for actors in a live ambush standoff.
      # Custom decorators are string-compared, so gate on empty vs non-empty.
      - decoratorName: "is_ambush_thug"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} and the other thugs back down and leave {{ player.name }} be"
