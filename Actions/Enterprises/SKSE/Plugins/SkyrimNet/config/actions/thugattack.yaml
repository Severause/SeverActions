customCategory: employment
name: ThugAttack
description: "Use when the speaker is one of the hired thugs confronting {{ player.name }} in an ambush and the standoff has turned to violence - {{ player.name }} refused to settle, threatened the thugs, mocked their employer, drew a weapon, or struck first. The whole pack falls on {{ player.name }} and attacks. Do not call this before {{ player.name }} has actually answered the demand - the thugs stopped them to talk first. Only attack once the answer is clearly a refusal or a hostile move. Prefer ThugStandDown if they pay, frighten, or talk the thugs out of it."
questEditorId: SeverActions
scriptName: SeverActions_Travel
executionFunctionName: ThugAttack_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the thug opening the attack
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      # is_ambush_thug returns "1" only for actors in a live ambush standoff.
      - decoratorName: "is_ambush_thug"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} and the other thugs attack {{ player.name }}"
