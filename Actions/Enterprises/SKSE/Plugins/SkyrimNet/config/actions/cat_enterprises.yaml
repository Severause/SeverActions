customCategory: enterprises
name: Enterprises
description: "Putting NPCs to work running off-screen ventures for the player. Use for: hiring an NPC as a retainer to run a mine, a shop or trade stall, an alchemy bench, a farm, a fencing operation, a mercenary contract, or an escort/caravan route; collecting the gold and goods a retainer has produced; paying back-wages the player owes a retainer; or dismissing a retainer from the player's service. NOT for recruiting a combat follower (use Companion) and NOT for one-off gold gifts or payments (use Economy)."
enabled: true
