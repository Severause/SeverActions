customCategory: employment
name: ReleaseCampFromService
description: "Use when {{ player.name }} has decided to release the speaker's SWORN CAMP from their service — cutting them loose entirely. Every member comes off {{ player.name }}'s books, the camp keeps whatever it has, and the place goes back to being an ordinary outlaw camp answering to nobody. Call it only when {{ player.name }} has clearly said they are letting the camp go, not when the speaker is merely complaining, asking for better terms, or threatening to leave."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: ReleaseCampFromService
parameterMapping:
  - type: speaker
    name: akActor
    description: a member of the sworn camp {{ player.name }} is releasing
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      # Feature gate. Disabling camp takeover empties this decorator, which
      # removes the action from the eligible list entirely — rather than
      # leaving it offered and silently refused by the native.
      - decoratorName: "sever_camp_takeover"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a camp that actually swore can be released.
      - decoratorName: "sever_camp_state"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: "sworn"
    logicalOperator: "AND"
    required: true
  - conditions:
      # rank < 0 — NOT is_in_faction. SexLab/OStim leave an NPC stuck at rank -1
      # after a scene, and a rank-blind check would gate this off permanently.
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ player.name }} released {{ actor.name }}'s camp from service"
