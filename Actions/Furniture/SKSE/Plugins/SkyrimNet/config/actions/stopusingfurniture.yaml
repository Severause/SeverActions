name: StopUsingFurniture
description: "The speaker gets up from furniture they are using — pushes back from the chair, rolls off the bed, rises from the shrine. Use only when they are currently sitting, lying, or kneeling and should stand."
questEditorId: SeverActions
scriptName: SeverActions_Furniture
executionFunctionName: StopUsingFurniture_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor getting back up
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
