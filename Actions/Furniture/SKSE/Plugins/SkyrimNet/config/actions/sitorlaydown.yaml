name: SitOrLayDown
description: "The speaker settles onto furniture — a chair, bench, bed, or shrine. Use when they say they want to sit, rest, sleep, or pray, or would naturally settle in. Pick the FormID from the nearby objects list. NOT if they are already using furniture."
questEditorId: SeverActions
scriptName: SeverActions_Furniture
executionFunctionName: UseFurniture_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor settling in
  - type: dynamic
    name: furnitureFormId
    description: "FormID of the furniture to use. Copy it exactly from the nearby objects list; never invent one."
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
