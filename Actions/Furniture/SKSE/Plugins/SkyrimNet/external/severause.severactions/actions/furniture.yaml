customCategory: sa_furniture
name: Furniture
description: "Category: the speaker sits, lies down or kneels at a piece of furniture nearby (a chair, bench, bed or shrine) right now. Only when that happens in this line; talk about resting or sleeping later is not. Going somewhere else is Journeys."
enabled: true

eligibilityRules:
  - conditions:
      # A bound captive cannot act (see the is_kidnap_victim bullet in CLAUDE.md).
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true