name: MoveCaptive
description: "Relocate a held captive to a new destination: the companion walks to the captive, unties them, marches them to the new location, and binds them again there. Use when {{ player.name }} orders a captive moved (e.g. somewhere safer, or further from prying eyes). Only works on captives currently held bound."
questEditorId: SeverActions
scriptName: SeverActions_FollowerManager
executionFunctionName: MoveCaptive
parameterMapping:
  - type: speaker
    name: akEscort
    description: the companion moving the captive (may differ from the original kidnapper)
  - type: dynamic
    name: targetName
    description: "the captive's name (may be approximate; matched against current captives only)"
    optional: true
  - type: dynamic
    name: destination
    description: "the destination (e.g. 'Breezehome', a known interior)"
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      # Opt-in feature toggle. Custom decorator — STRING compare, never == true.
      - decoratorName: "sever_kidnap_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
      # OR the restrain opt-in: restraint is default-ON while kidnap is
      # default-OFF, and a restrained captive must be manageable under
      # default settings.
      - decoratorName: "sever_restrain_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "OR"
    required: true
  - conditions:
      - decoratorName: "is_sever_follower"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # A bound captive cannot manage captives or take new ones (the
      # self-release hole). String decorator: "" = not a victim -> eligible.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Arrest in flight (either side), judgment, escort, spell cast — the
      # SeverActions arrest path calls SetActorBusy("arrest") on BOTH the
      # guard and the person being arrested. Users reported each of them
      # kicking off a captive move mid-arrest; two FSMs then fight over the same
      # actor's packages and captured AVs. Built-in decorator, real bool.
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Mid-scene speakers (SexLab). get_faction_rank < 0, NOT is_in_faction:
      # both frameworks can leave an NPC stuck in the faction at rank -1 after
      # a scene ends, and is_in_faction reads that as "still animating" —
      # gating the action forever. rank >= 0 = actually animating; -1 (stuck)
      # and -2 (not a member) both pass. This is the same conversion the 3.x
      # sweep applied to 62 other YAMLs; see CHANGELOG under is_in_faction ->
      # get_faction_rank.
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      # Mid-scene speakers (OStim) — same sentinel rule.
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} sets out to move the captive to {{ destination }}"
