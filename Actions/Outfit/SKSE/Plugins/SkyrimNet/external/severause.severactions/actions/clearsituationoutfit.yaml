customCategory: outfit
name: ClearSituationOutfit
description: "Use when the speaker is told, or decides, in this line to stop changing outfit by themselves in one situation. Drops that one standing rule; they keep wearing whatever they have on now. Not for changing clothes now (ApplyOutfitPreset) or setting a new rule (SetSituationOutfit)."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: ClearSituationPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor dropping a standing wardrobe rule
  - type: dynamic
    name: situation
    description: "the situation to drop the rule for: one of town, adventure, home, sleep, combat, rain, snow"
enabled: true
eventString: "{{ actor.name }} stops dressing automatically for {{ situation }}"
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Outfit system master switch. Off removes the action from the eligible
      # list entirely rather than letting the LLM offer a redress the Papyrus
      # side then refuses (field report 2026-09-09: "is there a way to
      # completely disable the outfit system"). Custom decorator, so a STRING
      # compare - never expectedValue: true.
      - decoratorName: "sever_outfit_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
