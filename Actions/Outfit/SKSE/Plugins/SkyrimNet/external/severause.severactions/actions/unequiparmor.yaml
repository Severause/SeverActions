customCategory: outfit
name: UnequipArmor
description: "Use when the speaker takes off specific things they are wearing or holding right now, asked to or by their own choice: a chafing helmet, bloody gauntlets, a weapon put away. Removes the named items; several can be named. Not for stripping everything (Undress) or handing items to someone (Items)."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: UnequipMultipleItems_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor taking pieces of gear off
  - type: dynamic
    name: itemNames
    description: "what to take off, by item name, comma-separated for several (e.g. 'steel gauntlets, iron helmet'); only things the speaker has on"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Outfit system master switch. Off removes the action from the eligible
      # list entirely rather than letting the LLM offer a redress the Papyrus
      # side then refuses (field report 2026-09-09: "is there a way to
      # completely disable the outfit system"). Custom decorator, so a STRING
      # compare - never expectedValue: true.
      - decoratorName: "sever_outfit_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
