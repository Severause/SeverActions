customCategory: outfit
name: SetSituationOutfit
description: "Use when {{ player.name }} tells the speaker to always wear one of their saved outfits in a situation, or the speaker settles on that rule, in this line. From then on they change into it by themselves whenever that situation begins. Their saved outfits: {{ sever_outfit_presets(npc.UUID) }}. Not for changing clothes this moment (ApplyOutfitPreset) or a passing remark about what suits the weather."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: SetSituationPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor laying down a standing wardrobe rule
  - type: dynamic
    name: situation
    description: "when the rule applies: one of town, adventure, home, sleep, combat, rain, snow (nothing else is recognised)"
  - type: dynamic
    name: presetName
    description: "the saved outfit to wear then, spelled exactly as one of the saved outfit names in the description"
enabled: true
eventString: "{{ actor.name }} now wears their {{ presetName }} outfit whenever {{ situation }} comes"
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Outfit system master switch. Off removes the action from the eligible
      # list entirely rather than letting the LLM offer a redress the Papyrus
      # side then refuses (field report 2026-09-09: "is there a way to
      # completely disable the outfit system"). Custom decorator, so a STRING
      # compare - never expectedValue: true.
      - decoratorName: "sever_outfit_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A preset must exist to apply or map (P10 audit #76): the model can only
      # guess names otherwise. sever_outfit_presets lists the NPC's preset
      # names (also injected by outfit_context). Custom decorator: a STRING
      # compare, "" = no presets.
      - decoratorName: "sever_outfit_presets"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
