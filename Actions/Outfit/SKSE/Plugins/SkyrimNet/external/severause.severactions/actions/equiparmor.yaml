customCategory: outfit
name: EquipArmor
description: "Use when the speaker puts on specific things from their own pack right now, because {{ player.name }} asked or they chose to: buckling on gauntlets before a fight, a circlet to meet a Jarl. Equips the named armor, clothing, weapon, torch or ammo they carry; several can be named. Not for a saved outfit (ApplyOutfitPreset), putting back everything they took off (GetDressed), or items they do not have."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: EquipMultipleItems_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor pulling gear on
  - type: dynamic
    name: itemNames
    description: "what to put on, by item name, comma-separated for several (e.g. 'steel gauntlets, iron helmet'); only things the speaker carries"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Outfit system master switch. Off removes the action from the eligible
      # list entirely rather than letting the LLM offer a redress the Papyrus
      # side then refuses (field report 2026-09-09: "is there a way to
      # completely disable the outfit system"). Custom decorator, so a STRING
      # compare - never expectedValue: true.
      - decoratorName: "sever_outfit_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
