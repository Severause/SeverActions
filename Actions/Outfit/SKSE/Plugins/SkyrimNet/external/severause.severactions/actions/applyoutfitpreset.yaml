customCategory: outfit
name: ApplyOutfitPreset
description: "Use when the speaker changes into one of their saved outfits right now, because {{ player.name }} asked or they decided to. Takes off what they wear and puts that outfit on. Their saved outfits: {{ sever_outfit_presets(npc.UUID) }}. Not for single pieces (EquipArmor), putting back what they just took off (GetDressed), or a passing remark about what would suit them."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: ApplyOutfitPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor changing clothes
  - type: dynamic
    name: presetName
    description: "which saved outfit to wear, spelled exactly as one of the saved outfit names in the description (e.g. 'home', 'travel')"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Outfit system master switch. Off removes the action from the eligible
      # list entirely rather than letting the LLM offer a redress the Papyrus
      # side then refuses (field report 2026-09-09: "is there a way to
      # completely disable the outfit system"). Custom decorator, so a STRING
      # compare - never expectedValue: true.
      - decoratorName: "sever_outfit_enabled"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A preset must exist to apply or map (P10 audit #76): the model can only
      # guess names otherwise. sever_outfit_presets lists the NPC's preset
      # names (also injected by outfit_context). Custom decorator: a STRING
      # compare, "" = no presets.
      - decoratorName: "sever_outfit_presets"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
