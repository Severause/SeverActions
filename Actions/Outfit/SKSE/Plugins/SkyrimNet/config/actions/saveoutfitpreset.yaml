customCategory: outfit
name: SaveOutfitPreset
description: "Save what the speaker is currently wearing as a named outfit, for later recall with ApplyOutfitPreset. Use when the speaker wants to remember their current look under a short name (e.g. 'combat', 'home', 'formal')."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: SaveOutfitPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor naming the outfit they're wearing
  - type: dynamic
    name: presetName
    description: "short label to remember the outfit by (e.g. 'home', 'combat', 'formal')"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
