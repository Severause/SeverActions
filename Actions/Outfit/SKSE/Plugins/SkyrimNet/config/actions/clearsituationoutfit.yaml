customCategory: outfit
name: ClearSituationOutfit
description: "Drop the speaker's standing outfit rule for one situation — they stop changing automatically for it and wear whatever they have on. Use when the speaker is told to stop dressing for a situation, or decides to."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: ClearSituationPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor dropping a standing wardrobe rule
  - type: dynamic
    name: situation
    description: "which part of life they're freeing up: 'town', 'adventure', 'home', or 'sleep'"
enabled: true
eventString: "{{ actor.name }} stops dressing automatically for {{ situation }}"
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
