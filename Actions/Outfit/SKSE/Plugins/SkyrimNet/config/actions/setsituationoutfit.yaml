customCategory: outfit
name: SetSituationOutfit
description: "Set a standing rule: the speaker automatically changes into a saved outfit whenever one situation begins — 'town', 'adventure', 'home', or 'sleep'. Use when the speaker decides or is told to always wear a given outfit for a situation."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: SetSituationPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor laying down a standing wardrobe rule
  - type: dynamic
    name: situation
    description: "when this outfit applies: 'town', 'adventure', 'home', or 'sleep'"
  - type: dynamic
    name: presetName
    description: "the saved outfit they'll wear in that situation"
enabled: true
eventString: "{{ actor.name }} now wears their {{ presetName }} outfit whenever {{ situation }} comes"
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
