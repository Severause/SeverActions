customCategory: outfit
name: GetDressed
description: "Put back on the clothes and armor the speaker removed earlier. Use after Undress, or whenever the speaker is told to get dressed. For putting on specific named items, use EquipArmor instead; for a saved named outfit, use ApplyOutfitPreset."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: Dress_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor pulling their clothes back on
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
