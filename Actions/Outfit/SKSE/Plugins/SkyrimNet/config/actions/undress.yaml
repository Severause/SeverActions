customCategory: outfit
name: Undress
description: "Take off all equipped armor and clothing. Use when the speaker strips down — for bed, a wash, or when told to undress. For removing only specific pieces, use UnequipArmor instead."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: Undress_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor stripping down
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
