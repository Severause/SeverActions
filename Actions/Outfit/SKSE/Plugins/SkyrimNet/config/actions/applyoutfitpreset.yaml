customCategory: outfit
name: ApplyOutfitPreset
description: "Change into an outfit previously saved with SaveOutfitPreset. Use when the speaker is told to wear one of their named outfits, or decides to."
questEditorId: SeverActions
scriptName: SeverActions_Outfit
executionFunctionName: ApplyOutfitPreset_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor changing clothes
  - type: dynamic
    name: presetName
    description: "which saved outfit to put on (e.g. 'home', 'combat', 'formal', 'casual')"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
