customCategory: brawl
name: AcceptBrawl
description: "Use when someone has dared the speaker to a fist-fight (a challenge waiting on their answer, or {{ player.name }} daring them out loud just now) and the speaker says yes in this line. The fight starts at once: fists only. To start a fist-fight nobody asked for, ChallengeBrawl, so the other side can answer; to refuse, DeclineBrawl."
questEditorId: SeverActions
scriptName: SeverActions_Brawl
executionFunctionName: AcceptBrawl_Execute
parameterMapping:
  - type: speaker
    name: akAccepter
    description: the actor stepping into the brawl
  - type: dynamic
    name: challenger
    # optional is load-bearing: without it, SkyrimNet's missing-parameter
    # check aborts execution when the LLM omits the key (which the
    # description invites) — the accept silently never reached Papyrus.
    # Omitted → null → None, and AcceptBrawl_Execute(akChallenger = None)
    # resolves the pending challenge itself.
    optional: true
    description: "who the speaker will fight (as listed in Nearby Actors, or the player's name); leave empty when answering a challenge already waiting on them"
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # Off the table while the speaker is on the combat cooldown of a ceasefire,
      # yield or brawl. Custom decorator: STRING compare, "" = no cooldown.
      - decoratorName: "sever_combat_cooldown"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # "[BRAWL ACTIVE]" is sever_brawl_state's marker text (SkyrimNetBridge.h);
      # keep the two byte-identical.
      - decoratorName: "sever_brawl_state"
        arguments: ["currentActor"]
        comparisonOperator: "not_contains"
        expectedValue: "BRAWL ACTIVE"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
