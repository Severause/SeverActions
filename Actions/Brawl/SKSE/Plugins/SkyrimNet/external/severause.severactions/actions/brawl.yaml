customCategory: brawl
name: Brawl
description: "Category: a fist-fight, fists only, that ends when someone drops or gives up, never in death: dare someone present to one, answer a dare (accept or refuse), or give up a fist-fight already under way. Only for the dare, the answer or the surrender in this line; teasing, boasts and 'I could take you' are words. Armed fights are Combat."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true