customCategory: brawl
name: ForfeitBrawl
description: "Use when the speaker, in a fist-fight already under way, gives up in this line: hands up, done. The other fighter wins and both stand down unharmed. Not for taunts or a breather mid-fight. Surrendering a real armed fight is Combat."
questEditorId: SeverActions
scriptName: SeverActions_Brawl
executionFunctionName: ForfeitBrawl_Execute
parameterMapping:
  - type: speaker
    name: akForfeiter
    description: the actor giving up the brawl
enabled: true
defaultPriority: 8
eligibilityRules:
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # "[BRAWL ACTIVE]" is sever_brawl_state's marker text (SkyrimNetBridge.h);
      # keep the two byte-identical.
      # Never is_in_combat: under the brawler combat style both fighters often read not in combat.
      - decoratorName: "sever_brawl_state"
        arguments: ["currentActor"]
        comparisonOperator: "contains"
        expectedValue: "BRAWL ACTIVE"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
