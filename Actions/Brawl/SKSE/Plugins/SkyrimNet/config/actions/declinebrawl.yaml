customCategory: brawl
name: DeclineBrawl
description: "Refuse a brawl challenge without fighting. akChallenger names the actor whose challenge is refused; may be omitted if a ChallengeBrawl is already pending."
questEditorId: SeverActions
scriptName: SeverActions_Brawl
executionFunctionName: DeclineBrawl_Execute
parameterMapping:
  - type: speaker
    name: akDecliner
    description: the actor refusing the challenge
  - type: dynamic
    name: akChallenger
    # optional is load-bearing — see acceptbrawl.yaml: omission used to
    # abort execution before Papyrus ever ran.
    optional: true
    description: the actor whose challenge is being declined. May be omitted when declining a pending challenge already recorded via ChallengeBrawl.
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
