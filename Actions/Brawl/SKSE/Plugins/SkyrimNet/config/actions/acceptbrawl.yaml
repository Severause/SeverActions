customCategory: brawl
name: AcceptBrawl
description: "Start a fist-fight now — fists only, no weapons, no spells. Use when the speaker answers a challenge or provocation with fists. akChallenger names the other fighter; omit it when a ChallengeBrawl is already pending. To issue a new challenge and wait for an answer, use ChallengeBrawl."
questEditorId: SeverActions
scriptName: SeverActions_Brawl
executionFunctionName: AcceptBrawl_Execute
parameterMapping:
  - type: speaker
    name: akAccepter
    description: the actor stepping into the brawl
  - type: dynamic
    name: akChallenger
    # optional is load-bearing: without it, SkyrimNet's missing-parameter
    # check aborts execution when the LLM omits the key (which the
    # description invites) — the accept silently never reached Papyrus.
    # Omitted → null → None, and AcceptBrawl_Execute(akChallenger = None)
    # resolves the pending challenge itself.
    optional: true
    description: the other actor in the fight (the one who challenged, or the one the speaker is challenging back). May be omitted when accepting a pending challenge already recorded via ChallengeBrawl.
enabled: true
defaultPriority: 7
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
