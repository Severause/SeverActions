customCategory: brawl
name: ChallengeBrawl
description: "Challenge the target to a fist-fight and await their answer. Fists only — no weapons, no spells. Use for tavern arguments, grudges, or tests of mettle that should stay non-lethal. To attack with weapons instead, use AttackTarget."
questEditorId: SeverActions
scriptName: SeverActions_Brawl
executionFunctionName: ChallengeBrawl_Execute
parameterMapping:
  - type: speaker
    name: akChallenger
    description: the actor throwing down the gauntlet
  - type: dynamic
    name: akTarget
    description: the actor being challenged
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
