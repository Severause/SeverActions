customCategory: items
name: UseItem
description: "Use when the speaker would consume something they carry — a potion when wounded, food when hungry, an ingredient to taste it. The item must be in the speaker's own pack."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: UseItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor reaching for something in their pack
  - type: dynamic
    name: itemName
    description: name of the consumable being used (e.g. "Health Potion", "Bread", "Frost Mirriam")
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
