customCategory: items
name: BringItem
description: "Fetch-and-deliver in one motion: the speaker picks up a loose item nearby and carries it to the target actor. Use when someone asks the speaker to bring or fetch something. NOT for keeping the item — use PickUpItem for that."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: BringItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor doing the fetching
  - type: dynamic
    name: akTarget
    description: "the actor the item is being brought to (their name)"
  - type: dynamic
    name: itemType
    description: "name or type of the item to fetch (e.g. 'sword', 'potion', 'book')"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
