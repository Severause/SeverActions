customCategory: items
name: GiveItem
description: "Use when the speaker offers an item to someone or is asked for one. The item moves from the speaker's pack into the target's — a gift, payment, a healing draught pressed into a friend's hand. NOT for receiving — use TakeItem."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: GiveItem_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor parting with the item
  - type: dynamic
    name: akTarget
    description: the actor whose hands the item is going into
  - type: dynamic
    name: itemName
    description: name of the item being handed over (e.g. "Iron Sword", "Health Potion", "her mother's locket")
  - type: dynamic
    name: aiCount
    description: "how many units to give — a positive whole number (default 1)"
    optional: true
    default: 1
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
