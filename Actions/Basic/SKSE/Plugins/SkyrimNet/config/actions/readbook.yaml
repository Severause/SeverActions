customCategory: items
name: ReadBook
description: "Read a book or note aloud from the speaker's or {{ player.name }}'s pack; reading continues until StopReading. The book's real text appears only after this action fires — until then, roleplay opening the book and finding the page; never recite, quote, or invent its contents."
questEditorId: SeverActions
scriptName: SeverActions_Loot
executionFunctionName: ReadBook_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor cracking open the book
  - type: dynamic
    name: bookName
    description: the exact title of the book or note (carried by the speaker or by {{ player.name }})
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
