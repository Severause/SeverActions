name: StopFollowing
description: "Stop following {{ player.name }}: the speaker parts ways and returns to their own business. Use only when the speaker is currently following and is dismissed, told to part ways, or chooses to stop."
questEditorId: SeverActions
scriptName: SeverActions_Follow
executionFunctionName: StopFollowing
parameterMapping:
  - type: speaker
    name: akActor
    description: the actor breaking off from {{ player.name }}
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_follower"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
