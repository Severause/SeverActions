customCategory: economy
name: GiveGold
description: "Coin moves FROM the speaker TO someone else — a gift, a generous tip, a finder's fee, a reward, a refund, or settling up for goods already handed over. Use this whenever the speaker is the one paying and no more specific action fits. Buying goods in the same breath (coin one way, goods the other) is BuyItem; paying back a recorded debt is RepayDebt. NEVER CollectPayment — that takes gold FROM the other party."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: GiveGold_Execute
parameterMapping:
  - type: speaker
    name: akGiver
    description: the actor parting with coin
  - type: dynamic
    name: akRecipient
    description: the actor receiving the coin
  - type: dynamic
    name: aiAmount
    description: how many gold coins change hands
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
