customCategory: economy
name: CollectPayment
description: "Take gold that is owed TO the speaker and ready to be paid — a tab settled at the bar, a fee for a finished job. Gold moves FROM the other party TO the speaker, never the reverse. NEVER use when the speaker is the one paying: the speaker buying goods is BuyItem, the speaker handing over coin is GiveGold, the speaker settling their own debt is RepayDebt. Gold only, no goods: NOT for selling an item (use SellItem), NOT for coin taken by threat (use ExtortGold)."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: CollectPayment_Execute
parameterMapping:
  - type: speaker
    name: akCollector
    description: the actor receiving payment — the merchant at the counter, the innkeeper at the bar, the worker collecting their fee
  - type: dynamic
    name: akPayer
    description: the actor settling up — the customer, the patron, the one being charged
  - type: dynamic
    name: aiAmount
    description: how many gold coins are being handed over
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
