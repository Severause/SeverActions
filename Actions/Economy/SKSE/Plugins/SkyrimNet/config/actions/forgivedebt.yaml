customCategory: economy
name: ForgiveDebt
description: "Cancel EVERY debt the other person owes the speaker, all tabs at once, with no gold changing hands — a deliberate act of mercy or giving up on collecting entirely. NEVER call this to acknowledge a payment: payments settle their own debts automatically, and calling this after one would erase the person's OTHER unrelated debts too. To waive only part of what is owed, use ReduceDebt instead."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: ForgiveDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor letting the debt go — the one who is owed the coin
  - type: dynamic
    name: akTarget
    description: the actor being released from what they owed
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # get_faction_rank, not is_in_faction: RemoveFromFaction sets rank -1
      # (layered override), it does not erase membership — a rank-blind check
      # reads a former creditor as one forever. Only rank >= 0 is a live
      # creditor. Mirrors reducedebt.yaml's documented fix.
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SeverActions_CreditorFaction"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
