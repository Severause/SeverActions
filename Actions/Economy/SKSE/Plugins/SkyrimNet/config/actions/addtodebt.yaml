customCategory: economy
name: AddToDebt
description: "Increase a tab the target already owes the speaker — another round, another repair on the same slate. Use only when a debt between these two already exists. To open a new tab, use CreateDebt."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: AddToDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor adding the charge — the merchant ringing up another round, the smith logging another repair
  - type: dynamic
    name: akTarget
    description: the actor whose tab is growing
  - type: dynamic
    name: aiAmount
    description: additional gold being added to the tab
  - type: dynamic
    name: asReason
    # optional is load-bearing: "leave empty" invites the LLM to omit the
    # key entirely, which used to abort execution at SkyrimNet's
    # missing-parameter check — the tab was never charged.
    optional: true
    default: ""
    description: "the original reason on the tab, for matching when the actor has multiple (leave empty to use whatever tab is found)"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # get_faction_rank, not is_in_faction: RemoveFromFaction sets rank -1
      # (layered override), it does not erase membership — a rank-blind check
      # reads a former creditor as one forever. Only rank >= 0 is a live
      # creditor. Mirrors reducedebt.yaml's documented fix.
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SeverActions_CreditorFaction"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
