customCategory: economy
name: SellItem
description: "The speaker is selling something here and now — goods one way, coin the other, settled in the same breath. A merchant pushing wares across the counter, an adventurer offloading loot to a fence. NOT for handing over a finished workshop commission — use CollectCommission for that."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: SellItem_Execute
parameterMapping:
  - type: speaker
    name: akSeller
    description: the actor handing over the goods to take the coin
  - type: dynamic
    name: akBuyer
    description: the actor paying for the goods — the patron at the counter, the customer on the road, the noble commissioning the work. Must be a DIFFERENT actor than the seller.
  - type: dynamic
    name: asItemName
    description: the item's name EXACTLY as it appears in the game's inventory, in the game's own language — never translate it to English on a localized game. Fuzzy-matched against the seller's personal inventory and, for shopkeepers, their merchant chest.
  - type: dynamic
    name: aiQuantity
    description: how many units of the item (1 for a single piece)
  - type: dynamic
    name: aiTotalGold
    description: the agreed price in gold coins for the whole deal (not per unit)
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
