customCategory: economy
name: SellItem
description: "Use when the speaker sells a specific item from their own stock to a buyer who has picked it or accepted the offer, at a set price: the goods go to the buyer and the coin to the speaker in one step, once per sale. Not for listing wares, pitching, naming prices before they choose, or haggling. A service with no item is CollectPayment; a smith's finished order is Crafting."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: SellItem_Execute
parameterMapping:
  - type: speaker
    name: akSeller
    description: the actor handing over the goods to take the coin
  - type: dynamic
    name: buyer
    description: "who is buying: exact name as listed in Nearby Actors, the player or another customer; never the speaker"
  - type: dynamic
    name: item
    description: "the item's exact in-game name, in the game's own language (never translated), as it appears in the speaker's inventory or shop stock"
  - type: dynamic
    name: quantity
    description: "how many, a whole number (1 for one)"
  - type: dynamic
    name: totalGold
    description: "the agreed price for the whole sale in gold, a whole number, not per unit"
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
