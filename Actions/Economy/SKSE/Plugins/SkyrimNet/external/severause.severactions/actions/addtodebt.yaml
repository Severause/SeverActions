customCategory: economy
name: AddToDebt
description: "Use when the speaker adds a new charge to a tab this person already owes them (another round, another repair, a fee) and the charge is accepted in this exchange. Not to open a first tab (CreateDebt). Not for an item handed over on credit: giving the item adds its value to the tab by itself, so charging it here bills it twice."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: AddToDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor adding the charge — the merchant ringing up another round, the smith logging another repair
  - type: dynamic
    name: debtor
    description: "who owes the tab: exact name as listed in Nearby Actors, or the player's name"
  - type: dynamic
    name: amount
    description: "gold to add, a whole number above 0"
  - type: dynamic
    name: reason
    # optional is load-bearing: "leave empty" invites the LLM to omit the
    # key, and an omitted required key aborts execution at SkyrimNet's
    # missing-parameter check, so the tab is never charged.
    optional: true
    default: ""
    description: "the reason on the existing tab, to pick one when they have several; leave empty to use their first tab"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a creditor. sever_is_creditor reads the debt store by FormID (a
      # faction named by EditorID never resolves on VR). Custom decorator, so
      # a STRING compare: "" = owed nothing.
      - decoratorName: "sever_is_creditor"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
