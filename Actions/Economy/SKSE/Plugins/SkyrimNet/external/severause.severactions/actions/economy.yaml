customCategory: economy
name: Economy
description: "Category: money changing hands right now: buying or selling an item at a set price, paying or collecting coin, a gift or reward, and opening, adding to, paying off, reducing or forgiving a tab or a recurring payment. Only when the exchange happens in this line and the other side has agreed; quoting prices, haggling, asking for or promising money, and a payment already made are words. Not here: an item handed over with no price (Items), a smith's order (Crafting), the player's own retainers and stewards (Employment), bounties (Arrest), the Final Audit (Taxes). In the intent, say who pays whom, how much, for what."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true