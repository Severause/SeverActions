customCategory: economy
name: Economy
description: "Category: money changing hands now: buying or selling, paying, tipping, rewarding or refunding someone, collecting what is owed or offered, and opening, adding to, paying off, reducing or forgiving a tab or recurring payment. The speaker choosing to pay, tip or reward counts even unasked, as does billing the player, who is asked to confirm; a sale, a new tab or billing anyone else needs their agreement in this line. Quoted prices, haggling, money asked for or promised, and coin already handed over are words. Not here: unpriced hand-overs (Items), a smith's order (Crafting), retainers (Employment), bounties (Arrest), the Final Audit (Taxes)."
enabled: true

eligibilityRules:
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true