customCategory: economy
name: CreateRecurringDebt
description: "Use when both sides agree in this exchange to a payment that repeats on a schedule: weekly rent, monthly tribute, standing dues, a hireling's regular pay. Records the arrangement: the first cycle is owed at once and each cycle adds another; one arrangement per pair. Not for stating what something costs before they agree, and not for a one-off tab (CreateDebt). Wages of {{ player.name }}'s own retainers and stewards are Employment."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: CreateRecurringDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor striking the arrangement (usually the one being paid each cycle)
  - type: dynamic
    name: creditor
    description: "who is paid each cycle: exact name as listed in Nearby Actors, or the player's name"
  - type: dynamic
    name: debtor
    description: "who pays each cycle, named the same way; not the same person"
  - type: dynamic
    name: amount
    description: "gold per cycle, a whole number above 0"
  - type: dynamic
    name: reason
    description: "what it is for, a few words ('room rent', 'weekly wages')"
    optional: true
    default: "unspecified"
  - type: dynamic
    name: intervalDays
    description: "days between charges: 1 daily, 7 weekly, 30 monthly"
    optional: true
    default: 7
  - type: static
    value: 0
    name: aiCreditLimit
    description: the ceiling on accumulated balance in gold (0 = no ceiling)
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
