customCategory: economy
name: ForgiveDebt
description: "Use when the speaker, who is owed money by this person, clearly cancels everything they owe, now: mercy, a reward, or giving up on collecting. Every tab they owe the speaker is erased, recurring rent, dues or wages included, and no coin moves. Not for a passing 'forget it' over a small favor, a joke, or an offer with conditions still open, and not after a payment (payments settle debts on their own). To waive only part, ReduceDebt."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: ForgiveDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor letting the debt go — the one who is owed the coin
  - type: dynamic
    name: debtor
    description: "who is released from what they owe the speaker: exact name as listed in Nearby Actors, or the player's name"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a creditor. sever_is_creditor reads the debt store by FormID (a
      # faction named by EditorID never resolves on VR). Custom decorator, so
      # a STRING compare: "" = owed nothing.
      - decoratorName: "sever_is_creditor"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
