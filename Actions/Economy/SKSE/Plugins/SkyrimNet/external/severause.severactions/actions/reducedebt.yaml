customCategory: economy
name: ReduceDebt
description: "Use when the speaker, who is owed money by this person, agrees in this exchange to take an amount off what they owe with no coin paid, for work, a favor, goods or goodwill. Once the deal is agreed, not while offering or haggling. Coin payments settle debts by themselves (RepayDebt, CollectPayment); cancelling everything they owe is ForgiveDebt."
questEditorId: SeverActions
scriptName: SeverActions_Debt
executionFunctionName: ReduceDebt_Execute
parameterMapping:
  - type: speaker
    name: akSpeaker
    description: the actor who is OWED the coin and is choosing to lower the debt
  - type: dynamic
    name: debtor
    description: "who owes the speaker: exact name as listed in Nearby Actors, or the player's name"
  - type: dynamic
    name: amount
    description: "gold to take off what they owe, a whole number; more than they owe simply clears it"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      # Only a creditor. sever_is_creditor reads the debt store by FormID (a
      # faction named by EditorID never resolves on VR). Custom decorator, so
      # a STRING compare: "" = owed nothing.
      - decoratorName: "sever_is_creditor"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
