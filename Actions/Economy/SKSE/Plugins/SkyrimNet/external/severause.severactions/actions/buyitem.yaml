customCategory: economy
name: BuyItem
description: "Use when the speaker buys a specific item they have chosen, at a set price, from someone who is selling it and has agreed: paying the barkeep for the drink they ordered, buying arrows from a fletcher. The coin goes from the speaker and the goods come to them in one step. Not while browsing, asking prices or haggling. Selling is SellItem; paying for a service with no item is GiveGold."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: BuyItem_Execute
parameterMapping:
  - type: speaker
    name: akBuyer
    description: the actor handing over the coin to take the goods
  - type: dynamic
    name: seller
    description: "who owns the goods: exact name as listed in Nearby Actors, usually the merchant; the player only when the speaker is buying the player's own item; never the speaker"
  - type: dynamic
    name: item
    description: "the item's exact in-game name, in the game's own language (never translated), as the seller carries it"
  - type: dynamic
    name: quantity
    description: "how many, a whole number (1 for one)"
  - type: dynamic
    name: totalGold
    description: "the agreed price for the whole purchase in gold, a whole number, not per unit"
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
