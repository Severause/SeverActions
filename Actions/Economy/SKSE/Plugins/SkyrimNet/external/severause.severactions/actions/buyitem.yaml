customCategory: economy
name: BuyItem
description: "Use when the speaker buys items they have chosen, at a set price, from someone who is selling them and has agreed: paying the barkeep for the drinks they ordered, buying arrows from a fletcher. One call covers the whole order: the coin goes once and the seller hands each person their goods. Not while browsing, asking prices or haggling. Selling is SellItem; paying for a service with no item is GiveGold."
questEditorId: SeverActions
scriptName: SeverActions_Currency
executionFunctionName: BuyItem_Execute
parameterMapping:
  - type: speaker
    name: akBuyer
    description: the actor handing over the coin to take the goods
  - type: dynamic
    name: seller
    description: "who owns the goods: exact name as listed in Nearby Actors, usually the merchant; the player only when the speaker is buying the player's own item; never the speaker"
  - type: dynamic
    name: item
    description: "the item's exact in-game name, in the game's own language (never translated), as the seller carries it; several items comma-separated, each with an optional count before it and, when it is for someone other than the speaker, 'for' and their exact name as listed in Nearby Actors, or the player's name, after it (e.g. '2 Black-Briar Mead, Ale for Rin'); copy the full name exactly as written in the inventory or object list, never as the player phrased it (player says 'эльфийские сапоги', the list has 'Стальные эльфийские лёгкие сапоги': pass 'Стальные эльфийские лёгкие сапоги'), keeping its capital first letter and every letter including ё"
  - type: dynamic
    name: quantity
    description: "how many, a whole number (1 for one); with several items, put 1 here and each item's count before its name"
  - type: dynamic
    name: totalGold
    description: "the agreed price for the whole purchase in gold, every item together, a whole number, not per unit"
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "sever_in_scene"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
