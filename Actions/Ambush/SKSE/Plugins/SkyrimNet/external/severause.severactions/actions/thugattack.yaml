customCategory: sa_ambush
name: ThugAttack
description: "Only for one of the armed group holding {{ player.name }} in an ambush standoff (hired blades over a debt, or searchers come for a captive), once {{ player.name }} has answered with a refusal, a threat, an insult to whoever sent them, a drawn weapon or a blow. The whole group attacks. Never before {{ player.name }} has answered. If they pay, give up the captive, or cow or talk the group down, ThugStandDown."
questEditorId: SeverActions
scriptName: SeverActions_Ambush
executionFunctionName: ThugAttack_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the thug opening the attack
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      # is_ambush_thug returns "1" only for actors in a live ambush standoff.
      - decoratorName: "is_ambush_thug"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} and the other thugs attack {{ player.name }}"
