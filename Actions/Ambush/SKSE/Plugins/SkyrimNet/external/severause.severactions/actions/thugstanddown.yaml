customCategory: sa_ambush
name: ThugStandDown
description: "Only for one of the armed group holding {{ player.name }} in an ambush standoff, once {{ player.name }} has given them real reason to back off: paid them, released the captive they came for, frightened them, or talked them down. The whole group lowers their weapons and leaves. Not while they still mean to fight, and not as a feint."
questEditorId: SeverActions
scriptName: SeverActions_Ambush
executionFunctionName: ThugStandDown_Execute
parameterMapping:
  - type: speaker
    name: akActor
    description: the thug calling off the ambush
enabled: true
defaultPriority: 6
eligibilityRules:
  - conditions:
      # is_ambush_thug returns "1" only for actors in a live ambush standoff.
      # Custom decorators are string-compared, so gate on empty vs non-empty.
      - decoratorName: "is_ambush_thug"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act. Hands tied, held, going nowhere - and an
      # LLM handed an action it cannot use will call it every round anyway
      # (owner report 2026-09-07). Custom decorator, so a STRING compare:
      # "" = not a victim -> eligible. Speech and internal bookkeeping are
      # deliberately exempt from this sweep: AppealDuringEscort (its speaker
      # IS the prisoner), ModifyArousal and ModifyArousalSLO. See the
      # is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ actor.name }} and the other thugs back down and leave {{ player.name }} be"
