customCategory: camp
name: BreakCamp
description: "Break down the active camp: snuff the fire, pack the tent and bedroll, stow the gear. Use when the party is leaving the campsite for good or the camp must be abandoned."
questEditorId: SeversHearth
scriptName: SeversHearth_Camp
executionFunctionName: BreakCamp
parameterMapping:
  - type: speaker
    name: akActor
    description: The actor breaking down the camp (player or companion).
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      # current_camp is a STRING decorator: non-empty = a camp stands. Without
      # this gate BreakCamp was offered with no camp to break (P0-14).
      - decoratorName: "current_camp"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ npc.name }} breaks down the camp."
isShortLived: true
