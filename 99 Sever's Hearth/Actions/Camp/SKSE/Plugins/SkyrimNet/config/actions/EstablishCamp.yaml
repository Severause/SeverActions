customCategory: camp
name: EstablishCamp
description: "Pitch a new camp at the current location: fire ring, bedroll, and gear from the Camp Kit. Use when the party decides to stop and camp here — to rest, eat, or take watch."
questEditorId: SeversHearth
scriptName: SeversHearth_Camp
executionFunctionName: EstablishCamp
parameterMapping:
  - type: speaker
    name: akActor
    description: The actor who suggested or initiated camping (player or companion).
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      # current_camp is a STRING decorator: empty = no camp yet. The old
      # description CLAIMED this restriction without enforcing it (P0-14).
      - decoratorName: "current_camp"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
eventString: "{{ npc.name }} pitches a camp."
isShortLived: false
