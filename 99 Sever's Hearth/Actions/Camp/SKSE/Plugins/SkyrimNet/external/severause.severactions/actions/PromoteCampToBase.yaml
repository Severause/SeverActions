customCategory: camp
name: PromoteCampToBase
description: "Use when {{ player.name }} and the speaker decide, in this line, that the camp pitched here becomes the company's permanent base. Nothing is rebuilt: tonight's camp simply stays standing while the company is away and can be built out. Not for pitching a new camp."
questEditorId: SeversHearth
scriptName: SeversHearth_Camp
executionFunctionName: PromoteCampToBase
parameterMapping:
  - type: speaker
    name: akActor
    description: The actor making the call (player or companion).
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      - decoratorName: "current_camp"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
      # A small camp never becomes the base; the marker is current_camp's text.
      - decoratorName: "current_camp"
        arguments: ["currentActor"]
        comparisonOperator: "not_contains"
        expectedValue: "A small camp"
      - decoratorName: "camp_base"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act - see the is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
