customCategory: camp
name: UpgradeBase
description: "Use when {{ player.name }} and the speaker decide, in this line, to build the company's base out one tier now: bivouac to encampment (sleeps four) or encampment to command camp (sleeps six). Works only with {{ player.name }} at the base, and costs firewood, leather and iron from the stash chest or {{ player.name }}'s pack (free for a tier built before). Not for talk of expanding it someday."
questEditorId: SeversHearth
scriptName: SeversHearth_Camp
executionFunctionName: UpgradeBase
parameterMapping:
  - type: speaker
    name: akActor
    description: The actor proposing the build (player or companion).
enabled: true
defaultPriority: 5
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      - decoratorName: "camp_base"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: ""
      # Already a command camp - nothing above it.
      - decoratorName: "camp_base_tier"
        arguments: ["currentActor"]
        comparisonOperator: "!="
        expectedValue: "command"
    logicalOperator: "AND"
    required: true
  - conditions:
      # A BOUND captive cannot act - see the is_kidnap_victim bullet in CLAUDE.md.
      - decoratorName: "is_kidnap_victim"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: ""
    logicalOperator: "AND"
    required: true
